<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prefix cache — tape-resume relay desk</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}

st for a single tape. The sprocket cranks new tokens at 500 tok/s, while a resume off the pegs takes 0.3 s however long the match is; in the measured agent run 74% of prompt tokens came off the pegs.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {

}
const tenth = (value) => {

};
function pathOf(points, closed = false) {

const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {

function extrude(ring, z, height, projection, options = {}) {

// model.mjs — pure prefix-cache model. No DOM, no kit, no node: modules.
// Every number the figure shows comes from here (spec R6–R14).
//
// The machine it models: a read bridge cranks a token tape through a
// sprocket (= prefill at PREFILL_TPS). A rack of brass pegs clips the end
// of every tape it has already read (= stored KV states, 80 KB per token).
// A new tape is matched against the pegs by its longest beginning
// (= longest-prefix resume, 0.3 s regardless of length); only the un-matched
// tail sees the sprocket. Stale pegs retract LRU-first; a tape longer than
// the whole rack is refused.

const KB_PER_TOKEN = 80; // state bytes per token
const BYTES_PER_TOKEN = KB_PER_TOKEN * 1024;
const CACHE_BYTES = 2 * 1024 ** 3; // default cache capacity (2 GiB)
const PREFILL_TPS = 500; // tokens/s for newly computed tokens
const RESUME_S = 0.3; // time to resume from cache, any length
const MAX_STORABLE_TOKENS = Math.floor(CACHE_BYTES / BYTES_PER_TOKEN); // 26,214
// Practical per-tape ceiling: one tape may not monopolise the whole rack
// (the bridge still needs pegs for the tapes it resumes between), so a state
// over 95% of capacity is refused: ~24,903 tokens on the 2 GiB rack.
const PRACTICAL_FRACTION = 0.95;
const PRACTICAL_MAX_TOKENS = Math.floor(MAX_STORABLE_TOKENS * PRACTICAL_FRACTION); // 24,903

// A cache is plain data: entries keyed by the tape's token list, each with a
// monotonically increasing `used` stamp for LRU ordering.
function makeCache(capacityBytes = CACHE_BYTES) {
  return {
    capacityBytes,
    maxStorableTokens: Math.floor(capacityBytes / BYTES_PER_TOKEN),
    maxPracticalTokens: Math.floor((capacityBytes * PRACTICAL_FRACTION) / BYTES_PER_TOKEN),
    entries: new Map(), // key -> { tokens, bytes, used }
    usedBytes: 0,
    clock: 0,
  };
}

function keyOf(tokens) {
  return tokens.join(",");
}

// Longest prefix of `tokens` that any stored state begins with.
function longestPrefixMatch(cache, tokens) {
  let best = 0;
  for (const entry of cache.entries.values()) {
    const limit = Math.min(entry.tokens.length, tokens.length);
    let n = 0;
    while (n < limit && entry.tokens[n] === tokens[n]) n++;
    if (n > best) best = n;
  }
  return best;
}

function evictLru(cache) {
  let oldest = null;
  for (const [key, entry] of cache.entries) {
    if (oldest === null || entry.used < oldest.entry.used) oldest = { key, entry };
  }
  if (oldest !== null) {
    cache.entries.delete(oldest.key);
    cache.usedBytes -= oldest.entry.bytes;
  }
  return oldest !== null;
}

function store(cache, tokens) {
  const key = keyOf(tokens);
  const bytes = tokens.length * BYTES_PER_TOKEN;
  let evictions = 0;
  const previous = cache.entries.get(key);
  if (previous !== undefined) {
    cache.entries.delete(key);
    cache.usedBytes -= previous.bytes;
  }
  while (cache.usedBytes + bytes > cache.capacityBytes && cache.entries.size > 0) {
    if (!evictLru(cache)) break;
    evictions += 1;
  }
  cache.clock += 1;
  cache.entries.set(key, { tokens: tokens.slice(), bytes, used: cache.clock });
  cache.usedBytes += bytes;
  return evictions;
}

// Serve one prompt (a plain array of token ids). Returns what the machine
// does: reused = tokens clipped on the peg rack, computed = tail through the
// sprocket, ttft = 0.3 s + tail/500, plus store/evict/refuse bookkeeping.
function serve(cache, tokens) {
  const reused = longestPrefixMatch(cache, tokens);
  const computed = tokens.length - reused;
  const ttft = RESUME_S + computed / PREFILL_TPS;

  // Refused if the state is larger than the whole cache (R12) or larger than
  // the practical single-tape ceiling (~25,000 tokens on the 2 GiB rack).
  const tooBig =
    tokens.length > cache.maxStorableTokens || tokens.length > cache.maxPracticalTokens;
  let stored = false;
  let refused = tooBig;
  let evicted = 0;

  if (!tooBig) {
    evicted = store(cache, tokens);
    stored = true;
  }

  return { reused, computed, ttft, stored, refused, evicted };

// Total tokens currently held as stored states.
function cacheTokensOf(cache) {
  let total = 0;
  for (const entry of cache.entries.values()) total += entry.tokens.length;
  return total;
}

  { id: "tail", label: "same prompt + new tail", tokens: BASE_PROMPT.concat(seqOf(20000, 512)) },
  { id: "unrelated", label: "unrelated prompt", tokens: seqOf(60000, 3072) },
  { id: "oversized", label: "prompt too large", tokens: seqOf(70000, 25500) },

// replay is identical): a coding session whose context grows turn by turn,
// interleaved with an unrelated research session, one mid-run compaction,
// and one giant paste over the practical ceiling. Token ids are disjoint per
// segment so prefixes only match where the story says they should.
function measuredTrace(seed = 20261012) {

    s = (s * 1664525 + 1013904223) >>> 0;

  let a = seg(1200, 1000); // session A: coding agent, 1,200-token system tape
  let b = seg(900, 500000); // session B: unrelated research agent
  for (let turn = 0; turn < 20; turn++) {
    a = a.concat(seg(250 + Math.floor(rnd() * 450), uid));
    uid += 5000;
    prompts.push(a.slice());
    if (turn % 3 === 2) {
      b = b.concat(seg(200 + Math.floor(rnd() * 300), uid));
      uid += 5000;
      prompts.push(b.slice());

  a = a.slice(0, 1200).concat(seg(400, uid)).concat(a.slice(-800));
  uid += 5000;
  prompts.push(a.slice());
  for (let turn = 0; turn < 4; turn++) {
    a = a.concat(seg(250 + Math.floor(rnd() * 450), uid));
    uid += 5000;
    prompts.push(a.slice());

  prompts.push(seg(25500, uid));

// Replay the measured run against the 2 GiB rack. Reports what the machine
// did: ~74% of all prompt tokens served from cache, and the ~25,000-token
// ceiling above which a prompt cannot be cached.
function replayMeasuredRun() {
  const cache = makeCache(CACHE_BYTES);
  let promptTokens = 0;
  let cacheTokens = 0;
  let computedTokens = 0;
  let refusedPrompts = 0;
  let evictedEntries = 0;
  for (const tokens of measuredTrace()) {
    const r = serve(cache, tokens);
    promptTokens += tokens.length;
    cacheTokens += r.reused;
    computedTokens += r.computed;
    evictedEntries += r.evicted;
    if (r.refused) refusedPrompts += 1;
  }
  return {
    promptTokens,
    cacheTokens,
    computedTokens,
    ratio: cacheTokens / promptTokens,
    refusedPrompts,
    evictedEntries,
    ceilingTokens: cache.maxPracticalTokens,
  };
}

    fig.touring = false;
  }

  const stepAt = (t) => {
    for (const s of demo.steps) if (t < s.t0 + s.dur) return s;
    return demo.steps[demo.steps.length - 1];
  };

  function draw(dt) {
    const s = mode === "manual" ? manual : stepAt(clock);
    // u = seconds since this step began; manual steps hold at their end so
    // the readout, lever and shuttle stay on the fired case until next time.
    const u = mode === "manual" ? Math.min(manualClock, s.dur) : clock - s.t0;
    const r = s.r;
    // shuttle: sweeps to this step's match peg, home otherwise
    const sweeping = settleStep(shuttleS, s.shuttleX, dt, 0.5);
    const sx = shuttleS.x - SHUTTLE_REST_X;
    for (const node of shuttle) move(node, sx, 0, 0);

    // sprocket + sprung feed claw: one ratchet stroke per token batch
    let pull = 0;
    if (s.pfFrom !== null && u >= s.pfFrom && u <= s.pfTo) {
      const span = s.pfTo - s.pfFrom;
      const cycles = Math.max(3, Math.round(span * 7)); // ~7 ratchets/s
      const uu = ((u - s.pfFrom) / span) * cycles;
      pull = 0.5 - 0.5 * Math.cos(2 * Math.PI * uu);
    }
    move(wheel, pull * 1.6, 0, 0);
    move(plunger, pull * 2.4, 0, 0);
    move(springBack, pull * 1.0, 0, 0);
    move(springFront, pull * 1.3, 0, 0);

    // one-shot envelopes: clip nudge (store), basket dip (evict), tray flap
    const flash = s.flashAt !== null ? burst(u - s.flashAt, 0.08, 0.22) : 0;
    move(clip, flash * 1.8, 0, 0);
    let dip = 0;
    for (const at of s.evictAts) dip += burst(u - at, 0.1, 0.35);
    move(basketRim, 0, 0, -Math.min(dip, 1.2) * 2.2);
    move(basketFloor, 0, 0, -Math.min(dip, 1.2) * 1.6);
    if (trayLip) {
      const flap = s.flapAt !== null ? burst(u - s.flapAt, 0.09, 0.3) : 0;
      if (flap < 0.005) trayLip.removeAttribute("transform");
      else {
        const a = (flap * 7).toFixed(2);
        trayLip.setAttribute("transform", "rotate(" + a + " " + TRAY_PIVOT[0].toFixed(1) + " " + TRAY_PIVOT[1].toFixed(1) + ")");
      }
    }

    // readout: phase word + numbers, all from this step's serve() result
    if (readoutEl && r) {
      const cranking = s.pfFrom !== null && u >= s.pfFrom && u <= s.pfTo;
      const word = r.refused
        ? "refused"
        : cranking
          ? "cranking"
          : sweeping
            ? "resuming"
            : flash > 0.05
              ? "clipped"
              : r.reused > 0
                ? "resumed"
                : "read";
      readoutEl.textContent = fmtReadout(r, word, s.fill, narrowMq.matches);
    }

    // selector lever: driven by the model state (which case is active),
    // never by CSS hover tricks; eases to the case's detent, home on demo
    const leverTarget = mode === "manual" ? LEVER_DOTS[activeCase] : LEVER_REST;
    settleStep(leverS, leverTarget, dt, 0.3);
    const ly = leverS.x - LEVER_REST;
    move(leverArm, 0, ly, 0);
    move(leverBall, 0, ly, 0);

    fig.frames = frames;
    fig.clock = clock;
    fig.step = s.kind;
    fig.last = r;
    fig.caseId = s.caseIdx === null || s.caseIdx === undefined ? null : CASES[s.caseIdx].id;
  }

  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    const quiet = now >= quietAt;
    if (mode === "manual" && quiet) mode = "demo"; // tour re-arms after the idle window
    if (mode === "manual") manualClock += dt;
    else if (quiet) clock = (clock + dt) % demo.total;
    fig.touring = mode === "demo" && quiet;
    frames += 1;
    draw(dt);
    frame = visible ? requestAnimationFrame(tick) : 0;
  }
  const run = () => {
    if (!frame && visible && !calm) {
      last = 0;
      frame = requestAnimationFrame(tick);
    }
  };

  // state hook for checks and later tasks (T009 tour re-arm)
  const fig = {
    frames: 0,
    clock: 0,
    visible: false,
    touring: !calm,
    still: calm,
    step: "idle",
    caseId: null,
    last: null,
    shuttle: shuttleS,
    cases: CASES.map((c) => c.id),
    activeCase: -1,
    idleSeconds: IDLE_S,
    fire: (i) => fire(i),
    fmtReadout,
    worstReadout: worstReadout(false),
    worstReadoutNarrow: worstReadout(true),
  };
  window.__figure = fig;

  // ---- case controls: buttons, keys 1-4, arrows, focus ring (T008) --------
  const styleEl = document.createElement("style");
  styleEl.textContent = `
.iso-cases{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.iso-case{font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--anatomy-text);background:transparent;border:1px solid var(--anatomy-mid);padding:6px 10px;cursor:pointer}
.iso-case:hover{border-color:var(--anatomy-muted)}
.iso-case[data-on="1"]{border-color:var(--anatomy-strong);color:var(--anatomy-strong)}
.iso-case:focus-visible,.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
`;
  document.head.appendChild(styleEl);
  const figureEl = stage.closest(".iso-figure");
  const bar = document.createElement("div");
  bar.className = "iso-cases";
  bar.setAttribute("role", "group");
  bar.setAttribute("aria-label", "Prompt cases: keys 1 to 4 or click");
  const caseButtons = CASES.map((c, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "iso-case";
    b.dataset.case = c.id;
    b.textContent = i + 1 + " · " + c.label;
    b.addEventListener("click", () => fire(i));
    bar.appendChild(b);
    return b;
  });
  if (figureEl) figureEl.insertBefore(bar, figureEl.querySelector(".iso-legend"));

  // The interactive cache is seeded with the base tape: the machine is
  // treated as having just read it, so case 1 resumes, case 2 resumes plus
  // the tail, case 3 matches nothing, case 4 is refused.
  const CASE_DUR = [1.7, 2.2, 2.3, 1.5];
  const CASE_SHUTTLE = [64, 58, SHUTTLE_REST_X, SHUTTLE_REST_X];
  const icache = makeCache();
  serve(icache, CASES[0].tokens);

  function fire(i) {
    const c = CASES[i];
    const r = serve(icache, c.tokens);
    manual = stamp({
      kind: c.id,
      r,
      dur: CASE_DUR[i],
      shuttleX: CASE_SHUTTLE[i],
      fill: icache.usedBytes / icache.capacityBytes,
    });
    manualClock = 0;
    mode = "manual";
    activeCase = i;
    fig.activeCase = i;
    manual.caseIdx = i;
    noteInteraction(); // takes over from the tour and restarts the idle timer
    for (const [j, b] of caseButtons.entries()) {
      if (j === i) b.setAttribute("data-on", "1");
      else b.removeAttribute("data-on");
    }
    if (calm) {
      frames = Math.max(frames, 1);
      draw(1 / 60);
    } else {
      run();
    }
  }

  stage.setAttribute(
    "aria-label",
    "Tape-resume relay desk: prefix-cache figure. Press 1 same prompt again, 2 same prompt with a new tail, 3 unrelated prompt, 4 prompt too large for the cache."
  );
  stage.addEventListener("pointerdown", () => noteInteraction());
  bar.addEventListener("pointerdown", () => noteInteraction());
  stage.addEventListener("keydown", (e) => {
    noteInteraction(); // any key takes over; case keys fire below
    const i = ["1", "2", "3", "4"].indexOf(e.key);
    if (i >= 0) {
      e.preventDefault();
      fire(i);
      return;
    }
    // with no case fired yet, arrows start at case 0 (no wrap to oversized)
    if (e.key === "ArrowRight" || e.key === "ArrowDown") {
      e.preventDefault();
      fire(activeCase < 0 ? 0 : (activeCase + 1) % CASES.length);
    } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
      e.preventDefault();
      fire(activeCase < 0 ? 0 : (activeCase + CASES.length - 1) % CASES.length);
    }
  });

  // motion stops when the figure is offscreen (newest entry wins)
  new IntersectionObserver(
    (entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      fig.visible = visible;
      if (visible) run();
      else if (frame) {
        cancelAnimationFrame(frame);
        frame = 0;
      }
    },
    { rootMargin: "120px 0px" }
  ).observe(stage);

  // reduced motion: one still frame, no tour, no loop
  if (calm) {
    frames = 1;
    draw(1 / 60);
  }
})();
</script></body></html>
