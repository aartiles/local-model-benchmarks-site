      html, body {

        position: relative;

      canvas {
        position: absolute;

      #controls-hint {

        line-height: 1.4;
        text-shadow: 1px 1px 0 #000;
        pointer-events: none;
        user-select: none;
        z-index: 10;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 24px;
        height: 24px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        user-select: none;
        z-index: 10;
      }
      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: #fff;
        box-shadow: 1px 1px 0 #000;
      }
      #crosshair::before {
        left: 50%;
        top: 0;
        width: 2px;
        height: 100%;
        transform: translateX(-50%);
      }
      #crosshair::after {
        top: 50%;
        left: 0;
        height: 2px;
        width: 100%;
        transform: translateY(-50%);
      }
