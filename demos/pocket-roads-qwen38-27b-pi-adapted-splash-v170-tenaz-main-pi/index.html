<body>
  <canvas id="scene"></canvas>

  <div id="hud" class="hidden" aria-hidden="true">
    <div class="hud-row">
      <span id="hud-speed">0</span><span class="hud-unit">km/h</span>
      <span id="hud-time">0.0</span>
      <span id="hud-distance">0 m</span>
      <span id="hud-checkpoint">0/4</span>
    </div>
  </div>

  <button id="mute-toggle" type="button" class="hidden" aria-pressed="false">🔊</button>

  <div id="controls" class="hidden">
    <div class="pad" id="pad-steer" data-input="steer"></div>
    <div class="pad" id="pad-throttle" data-input="throttle"></div>
    <div class="pad" id="pad-brake" data-input="brake"></div>
  </div>

  <div id="calibration" class="overlay hidden" aria-hidden="true">
    <div class="calibration-area" id="calibration-area">
      <img id="calibration-marker" src="assets/mark.svg" alt="placement marker" draggable="false" />
    </div>
    <div class="overlay-card">
      <h2>Place your toy</h2>
      <p class="overlay-status">Drag the marker to where the toy sits, then save.</p>
      <button id="calibration-save" type="button">Save position</button>
    </div>
  </div>

  <div id="overlay" class="overlay">
    <img id="overlay-stage" class="overlay-stage" src="assets/midnight-pass.webp" alt="Midnight Pass stage preview" />
    <div class="overlay-card" id="overlay-card">
      <h1>Pocket Roads</h1>
      <h2>Midnight Pass</h2>
      <p class="overlay-status" id="overlay-status">Loading…</p>
      <div id="mode-select" class="mode-select" role="group" aria-label="Game mode">
        <button id="mode-virtual" type="button" class="mode-btn" aria-pressed="true">Virtual</button>
        <button id="mode-physical" type="button" class="mode-btn" aria-pressed="false">Physical</button>
      </div>
      <button id="overlay-action" type="button">Start</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
