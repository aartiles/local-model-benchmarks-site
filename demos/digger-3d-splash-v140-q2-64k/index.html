  <style>
    :root {
      --hud-fg: #e8f4f2;
      --hud-dim: #7d8f92;
      --accent: #35e0a0;
      --gold: #ffcf4d;
      --danger: #ff5b6e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #07080c; overflow: hidden; font-family: "Courier New", monospace; }
    #app { position: relative; width: 100vw; height: 100vh; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; top: 10px; left: 14px; right: 14px; display: flex; gap: 18px; align-items: center;
      color: var(--hud-fg); font-size: 13px; letter-spacing: 1px; pointer-events: none; z-index: 20;
      text-shadow: 0 0 6px rgba(0,0,0,.8);
    }
    #hud .label { color: var(--hud-dim); font-size: 10px; }
    #hud .value { font-size: 16px; font-weight: bold; }
    #hud .score.punch { color: var(--gold); transform: scale(1.15); }
    #weapon { width: 110px; height: 10px; border: 1px solid #445; background: #101418; border-radius: 4px; overflow: hidden; }
    #weapon-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #35e0a0, #9ff7c8); }
    #bonus { color: var(--danger); display: none; }
    #bonus.active { display: block; }
    #lives .life { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); margin-right: 4px; }
    #overlays { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 30; pointer-events: none; }
    .overlay { display: none; text-align: center; color: var(--hud-fg); padding: 24px 32px; background: rgba(8,10,14,.82); border: 1px solid #2c3740; border-radius: 10px; pointer-events: auto; }
    .overlay.visible { display: block; }
    .overlay h1 { font-size: 34px; letter-spacing: 6px; margin: 0 0 6px; color: var(--accent); }
    .overlay h2 { font-size: 15px; letter-spacing: 3px; color: var(--gold); margin: 0 0 14px; }
    .overlay p { margin: 6px 0; font-size: 12px; color: var(--hud-dim); }
    .overlay .big { font-size: 18px; color: var(--hud-fg); }
    .overlay button { font-family: inherit; font-size: 12px; margin: 4px 6px; padding: 6px 12px; border: 1px solid #3a4a56; background: #131a22; color: var(--hud-fg); border-radius: 6px; cursor: pointer; }
    .overlay button:hover { background: #1d2733; }
    #popups { position: absolute; inset: 0; pointer-events: none; z-index: 25; }
    .popup { position: absolute; font-size: 14px; font-weight: bold; color: var(--gold); transform: translate(-50%,-50%); animation: pop 1s ease-out forwards; text-shadow: 0 0 8px rgba(0,0,0,.9); }
    .popup.green { color: var(--accent); }
    .popup.red { color: var(--danger); }
    @keyframes pop { 0% { opacity: 0; transform: translate(-50%,-30%) scale(.6);} 20% {opacity:1;} 100% { opacity: 0; transform: translate(-50%,-140%) scale(1.1); } }
    #debug { position: absolute; left: 12px; bottom: 12px; z-index: 22; display: none; background: rgba(6,8,12,.85); border: 1px solid #2c3740; border-radius: 8px; padding: 10px 14px; font-size: 11px; color: #9fb3ad; white-space: pre; line-height: 1.5; }
    #debug.visible { display: block; }
    #tests { position: absolute; right: 12px; bottom: 12px; z-index: 22; display: none; background: rgba(6,8,12,.9); border: 1px solid #2c3740; border-radius: 8px; padding: 10px 14px; font-size: 11px; color: #9fb3ad; max-height: 70vh; overflow: auto; }
    #tests.visible { display: block; }
    #tests .pass { color: #35e0a0; }
    #tests .fail { color: #ff5b6e; }
  </style>
