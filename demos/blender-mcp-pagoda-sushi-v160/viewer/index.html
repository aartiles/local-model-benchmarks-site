<body>
<div id="status">Loading the pagoda (3.4 MB)…</div>
<div class="bar">
  <span>Drag to orbit, scroll or pinch to zoom.</span>
  <button id="spin" type="button" aria-pressed="true">Auto-rotate: on</button>
  <span>The run's final.blend exported to glTF: flat colours stand in for its procedural materials, and its sky, mist and lamps are left out.</span>
  <a href="../">Rendered film</a>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { OrbitControls } from './vendor/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a3140);
scene.fog = new THREE.Fog(0x2a3140, 160, 420);
scene.add(new THREE.HemisphereLight(0xc9d6ff, 0x3a2f24, 1.6));
const sun = new THREE.DirectionalLight(0xffd9b0, 2.2);
sun.position.set(60, 90, 40);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.maxPolarAngle = Math.PI * 0.49;

const spin = document.getElementById('spin');
spin.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  spin.setAttribute('aria-pressed', String(controls.autoRotate));
  spin.textContent = `Auto-rotate: ${controls.autoRotate ? 'on' : 'off'}`;
});

const clock = new THREE.Clock();
let mixer = null;

new GLTFLoader().load('pagoda.glb', gltf => {
  scene.add(gltf.scene);
  // The pagoda is the tallest thing in the scene: frame it, not the ground.
  const box = new THREE.Box3();
  gltf.scene.traverse(o => { if (o.isMesh && /^(Base|Tier|Roof|Finial|Pagoda)/.test(o.name)) box.expandByObject(o); });
  if (box.isEmpty()) box.setFromObject(gltf.scene);
  const centre = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  controls.target.copy(centre);
  camera.position.set(centre.x + size.y * 1.5, centre.y + size.y * 0.2, centre.z + size.y * 1.5);
  controls.maxDistance = size.y * 6;
  controls.minDistance = size.y * 0.2;
  if (gltf.animations.length) {
    // The trees sway in the run's animation; play those clips on a loop.
    mixer = new THREE.AnimationMixer(gltf.scene);
    for (const clip of gltf.animations) mixer.clipAction(clip).play();
  }
  document.getElementById('status').remove();
}, undefined, () => { document.getElementById('status').textContent = 'The model could not be loaded.'; });

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  controls.update();
  renderer.render(scene, camera);
});
</script>
