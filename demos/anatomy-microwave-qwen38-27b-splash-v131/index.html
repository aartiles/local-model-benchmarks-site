// and level, the instant it opens.

  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };

  nubG.setAttribute("data-nub-x", nx.toFixed(2));
  nubG.setAttribute("data-nub-y", ny.toFixed(2));
  const [ix, iy] = iso([ICE.x + ICE.w / 2, ICE.y + ICE.d / 2, ICE.z + ICE.h / 2], DP);
  iceG.setAttribute("data-ice-x", ix.toFixed(2));
  iceG.setAttribute("data-ice-y", iy.toFixed(2));
  discG.setAttribute("data-angle", angle.toFixed(2));
  lastRotorAngle = angle;
}
function rotorUpdate() {
  const angle = turntableAngle(state.t, state.turntableOn); // 30°/s when on, 0 when off
  if (angle !== lastRotorAngle) drawRotor(angle); // clock frozen (offscreen/reduced) → no redraw
}

// The door: one world-rotation group re-drawn through the rotated projection.
// The visual swing eases (τ 0.6 s; reduced motion jumps); the interlock cut
// is instant and model-driven (powerAt in the energy update).
function drawDoor(angle) {
  const DP = rotProj(angle, DOORC.hinge);
  const { x, y, w, t, z, h, border } = DOORC;
  const [hx, hy] = DOORC.hinge;
  const brackets = [8.6, 18.7].map((bz) => solidSvg(slabOf({ x: -20.6, y: 11, w: 1.15, d: 0.35, r: 0.2 }, bz, 1.3, PROJ, 8, 0.15), { tone: "lo" }));
  const knuckle = solidSvg(cylinder(hx, hy, 0.5, z, h, DP, 20, 0.3), { tone: "hi" });
  const frameDefs = [
    ["bottom", { x, y, w, d: t, r: 0 }, z, border],
    ["top", { x, y, w, d: t, r: 0 }, z + h - border, border],
    ["left", { x, y, w: border, d: t, r: 0 }, z + border, h - 2 * border],
    ["right", { x: x + w - border, y, w: border, d: t, r: 0 }, z + border, h - 2 * border],
  ];
  const frame = frameDefs.map(([, wp, fz, fh]) => solidSvg(slabOf(wp, fz, fh, DP, 8, 0.12), { tone: "hi" }));
  const winPath = (pt) => iso([pt[0], y, pt[1]], DP);
  const windowD = pathOf(roundedPlan({ x: DOORW.x, y: DOORW.z, w: DOORW.w, d: DOORW.h, r: 1.2 }, 8).map(winPath), true);
  const gap = 0.8;
  const dots = [];
  for (let i = 0; i <= Math.floor((DOORW.w - 0.6) / gap); i++)
    for (let j = 0; j <= Math.floor((DOORW.h - 0.6) / gap); j++) {
      const px = DOORW.x + 0.3 + i * gap, pz = DOORW.z + 0.3 + j * gap;
      const ex = Math.min(px - DOORW.x, DOORW.x + DOORW.w - px);
      const ez = Math.min(pz - DOORW.z, DOORW.z + DOORW.h - pz);
      const [dx, dy] = iso([px, y, pz], DP);
      dots.push([dx, dy, Math.max(0.2, Math.min(1, ex / 1.6, ez / 1.6))]);
    }
  const mesh =
    '<g class="it" data-part="mesh" clip-path="url(#door-mesh-clip)"><clipPath id="door-mesh-clip"><path d="' +
    windowD + '"/></clipPath>' +
    dotsSvg(dots, { size: 0.55, tone: "mid" }) +
    lineSvg(windowD, { tone: "lo", free: true }) +
    "</g>";
  const handle2 =
    [
      [10.2, 0.5],
      [15.2, 0.5],
    ]
      .map(([hz, hh]) => solidSvg(slabOf({ x: 2.8, y, w: 0.6, d: 0.35, r: 0.18 }, hz, hh, DP, 8, 0.12), { tone: "lo" }))
      .join("") + solidSvg(slabOf({ x: 2.6, y: y + 0.9, w: 1.0, d: 0.8, r: 0.5 }, 9, 8, DP, 8, 0.2), { tone: "hi" });
  const interlock =
    solidSvg(slabOf({ x: 4.2, y, w: 1.3, d: t, r: 0.4 }, 12, 3, DP, 8, 0.12), { tone: "mid" }) +
    solidSvg(slabOf({ x: 4.55, y: 10.35, w: 0.6, d: 0.8, r: 0.25 }, 12.9, 1.2, DP, 8, 0.12), { tone: "hi" });
  doorGroup.innerHTML = partOf("hinge", [...brackets, knuckle]) + partOf("door", frame) + mesh + partOf("handle", [handle2]) + partOf("interlock", [interlock]);
  doorGroup.setAttribute("data-angle", angle.toFixed(2));
  const [px, py] = iso([x + w, y, z + h], DP);
  doorGroup.setAttribute("data-pos-x", px.toFixed(2));
  doorGroup.setAttribute("data-pos-y", py.toFixed(2));
  doorRendered = angle;
}
function doorUpdate(dt, calm) {
  const target = state.doorOpen ? 1 : 0;
  doorMix = calm ? target : doorMix + (target - doorMix) * (1 - Math.exp(-dt / 0.6));
  if (Math.abs(doorMix - target) < 0.0002) doorMix = target;
  const angle = doorMix * DOORC.angle;
  if (doorRendered === null || Math.abs(angle - doorRendered) > 0.01) drawDoor(angle);
}

// T013 — the reader's four discrete choices: door, turntable, power level
// (100/50/30) and contents (water/ice/dish). Pointer drives the buttons;
// the stage takes the keyboard (motion.md: arrows pick/step, Shift a full
// change, Home/End extremes, Space toggle, Escape release). Every change
// goes through applyChoice, which takes over from the tour (T014) — a
// helper that forces a value must not cancel the reader's own toggle of
// that same value, hence the switching flag.
// T014 — the idle tour (motion.md): after ~1.4 s without interaction a
// scripted loop takes over the same targets the controls do; any reader
// action (hover, focus, press, key) pauses it, and it resumes ~3.6 s after
// the last interaction. Under reduced motion it stays off entirely. Steps
// apply through applyChoice(..., byTour=true), so the reader's own changes
// step from the visible state, and a programmatic reset() latches the tour
// off for the life of the page (verify's checks set up state via reset).
let touring = false;
let tourLatched = false;
let tourClock = 0; // tour seconds; freezes offscreen, resumes where it stopped
let tourStep = -1; // last segment applied
let quiet = 0; // seconds since the reader's last interaction
let hadInput = false;
let tourBirth = null; // page time (state.t) the tour last started
const TOUR_START = 1.4;
const TOUR_RESUME = 3.6;
const TOUR_STEP = 2; // one segment of the loop
// Power and contents interleave, so any 8 s of the tour shows at least two
// power levels and two contents (verify T014 samples across an 8 s window).
const TOUR = [
  ["power", 100],
  ["contents", "water"],
  ["power", 50],
  ["contents", "ice"],
  ["power", 30],
  ["contents", "dish"],
  ["turntable", 0],
  ["turntable", 1],
  ["door", 1],
  ["door", 0],
];
function readerInput() {
  touring = false;
  hadInput = true;
  quiet = 0;
}
function takeOver(switching) {
  readerInput(); // switching is reserved: this helper forces no value, so there is nothing to cancel
}
const POWER_PCTS = Object.keys(POWER.levels).map(Number).sort((a, b) => b - a);
const FOOD_NAMES = Object.keys(FOODS);
const CONTROL_ORDER = ["door", "turntable", "power", "contents"];
let activeCtl = null;
let lastCtlText = "";
const ctlButtons = [...document.querySelectorAll(".mw-ctl [data-ctl]")];
const stateOf = {
  power: () => state.levelPct,
  contents: () => state.food,
  turntable: () => (state.turntableOn ? 1 : 0),
  door: () => (state.doorOpen ? 1 : 0),
};
function applyChoice(kind, value, byTour) {
  if (!byTour) takeOver(kind === "door");
  if (kind === "power") state.levelPct = POWER_PCTS.reduce((best, p) => (Math.abs(p - value) < Math.abs(best - value) ? p : best), POWER_PCTS[0]);
  else if (kind === "contents") {
    if (FOODS[value]) {
      state.food = value;
      state.foodState = initialFood(value);
    }
  } else if (kind === "turntable") state.turntableOn = value !== 0;
  else if (kind === "door") state.doorOpen = value !== 0;
  markActive();
  syncControls();
  refresh();
}
function markActive() {
  for (const b of ctlButtons) {
    const k = b.dataset.ctl;
    b.dataset.on = activeCtl && (k === activeCtl || (activeCtl === "contents" && k === state.food)) ? "true" : "false";
  }
}
function onCtlKey(e) {
  const k = e.key;
  if (k === "Escape") {
    activeCtl = null;
    markActive();
    if (stage) stage.blur();
    return;
  }
  if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Home", "End", " ", "Enter", "Shift"].includes(k)) return;
  e.preventDefault();
  takeOver(false);
  if (k === "Shift") return;
  if (k === " " || k === "Enter") {
    if (!activeCtl) {
      activeCtl = CONTROL_ORDER[0];
      markActive();
    }
    if (activeCtl === "power") applyChoice("power", POWER_PCTS[(POWER_PCTS.indexOf(state.levelPct) + 1) % POWER_PCTS.length]);
    else applyChoice(activeCtl, stateOf[activeCtl]() ? 0 : 1);
    return;
  }
  if (k === "ArrowUp" || k === "ArrowDown") {
    if (!activeCtl) {
      activeCtl = CONTROL_ORDER[0];
      markActive();
    }
    const dir = k === "ArrowUp" ? 1 : CONTROL_ORDER.length - 1;
    activeCtl = CONTROL_ORDER[(CONTROL_ORDER.indexOf(activeCtl) + dir) % CONTROL_ORDER.length];
    markActive();
    return;
  }
  if (!activeCtl) {
    activeCtl = CONTROL_ORDER[0];
    markActive();
  }
  const kind = activeCtl;
  if (k === "Home" || k === "End") {
    if (kind === "power") applyChoice("power", k === "Home" ? POWER_PCTS[POWER_PCTS.length - 1] : POWER_PCTS[0]);
    else if (kind === "contents") applyChoice("contents", k === "Home" ? FOOD_NAMES[0] : FOOD_NAMES[FOOD_NAMES.length - 1]);
    else applyChoice(kind, k === "Home" ? 0 : 1);
    return;
  }
  const dir = k === "ArrowRight" ? 1 : -1;
  if (e.shiftKey) {
    if (kind === "power") applyChoice("power", dir > 0 ? POWER_PCTS[0] : POWER_PCTS[POWER_PCTS.length - 1]);
    else if (kind === "contents") applyChoice("contents", dir > 0 ? FOOD_NAMES[0] : FOOD_NAMES[FOOD_NAMES.length - 1]);
    else applyChoice(kind, dir > 0 ? 1 : 0);
    return;
  }
  if (kind === "power") {
    const i = POWER_PCTS.indexOf(state.levelPct);
    applyChoice("power", POWER_PCTS[Math.min(POWER_PCTS.length - 1, Math.max(0, i + dir))]);
  } else if (kind === "contents") {
    const i = FOOD_NAMES.indexOf(state.food);
    applyChoice("contents", FOOD_NAMES[(i + dir + FOOD_NAMES.length) % FOOD_NAMES.length]);
  } else applyChoice(kind, stateOf[kind]() ? 0 : 1);
}
for (const b of ctlButtons) {
  b.addEventListener("click", () => {
    const id = b.dataset.ctl;
    if (FOOD_NAMES.includes(id)) applyChoice("contents", id);
    else if (id === "power") applyChoice("power", POWER_PCTS[(POWER_PCTS.indexOf(state.levelPct) + 1) % POWER_PCTS.length]);
    else applyChoice(id, stateOf[id]() ? 0 : 1);
  });
}
if (stage) {
  stage.addEventListener("keydown", onCtlKey);
  stage.addEventListener("focus", () => stage.classList.add("mw-focus"));
  stage.addEventListener("blur", () => stage.classList.remove("mw-focus"));
}
// Any reader action — pointer hover or press, focus, key — pauses the tour;
// the loop resumes it after TOUR_RESUME seconds of quiet.
for (const ev of ["pointermove", "pointerdown", "focusin", "keydown"]) document.addEventListener(ev, readerInput, { passive: true });
// The accessible value: written only when a discrete choice changes (never
// from the per-frame loop — screen readers announce every change of a
// focused group's value text, so per-frame numbers would be a stream).
function ctlUpdate() {
  const text =
    "power " + state.levelPct + "% · " + (state.doorOpen ? "door open" : "door closed") + " · turntable " + (state.turntableOn ? "on" : "off") + " · " + FOODS[state.food].label.toLowerCase();
  if (text !== lastCtlText) {
    lastCtlText = text;
    if (stage) stage.setAttribute("aria-valuetext", text);
  }
}
// The visible control bar tracks the same discrete state: each button's
// <b data-v> value text and the door/turntable aria-pressed are rewritten
// whenever a choice changes (never from the per-frame loop — power/turntable
// only move on a discrete reader action or a forced tour switch, so this is
// safe to gate on applyChoice). Contents buttons report the current selection
// via aria-pressed, since there is no single "on/off" value for them.
function syncControls() {
  const set = (kind, text, pressed) => {
    const b = ctlButtons.find((x) => x.dataset.ctl === kind);
    if (!b) return;
    const v = b.querySelector("b[data-v]");
    if (v) v.textContent = text;
    if (pressed != null) b.setAttribute("aria-pressed", pressed ? "true" : "false");
  };
  set("door", state.doorOpen ? "open" : "closed", state.doorOpen);
  set("turntable", state.turntableOn ? "on" : "off", state.turntableOn);
  set("power", state.levelPct + "%", null);
  for (const b of ctlButtons) if (FOOD_NAMES.includes(b.dataset.ctl)) b.setAttribute("aria-pressed", b.dataset.ctl === state.food ? "true" : "false");
}

// First live render of both swing systems, so their data attributes exist
// before the very first frame (and so the still/reduced figure starts from
// exactly the built poses: door 20° open, disc at 0°).
if (doorGroup) drawDoor(doorMix * DOORC.angle);
if (iceG && dishG && discG) drawRotor(turntableAngle(state.t, state.turntableOn));

syncControls();
refresh();
let last = 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 0;
  last = now;
  const calm = still.matches; // reduced motion: jump to targets, no easing
  if (handle.running && dt > 0) {
    state.t += dt;
    const { watts } = powerAt(state.levelPct, state.t, { doorOpen: state.doorOpen });
    state.foodState = stepFood(state.foodState, watts, dt);
    state.energyJ += watts * dt;
  }
  // The idle tour: quiet always accumulates (so an offscreen reader is still
  // "quiet"); stepping freezes with the figure (handle.running) and resumes
  // where it stopped. Never runs under reduced motion.
  if (!calm && dt > 0) {
    quiet += dt;
    if (touring && handle.running) {
      tourClock += dt;
      const step = Math.floor(tourClock / TOUR_STEP) % TOUR.length;
      if (step !== tourStep) {
        tourStep = step;
        applyChoice(TOUR[step][0], TOUR[step][1], true);
      }
    } else if (!touring && !tourLatched && quiet >= (hadInput ? TOUR_RESUME : TOUR_START)) {
      touring = true;
      tourBirth = state.t;
    }
  }
  for (const u of UPDATES) u(dt, calm);
  refresh();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; }, { rootMargin: "120px 0px" }).observe(stage);
still.addEventListener("change", () => {
  if (still.matches) {
    touring = false; // reduced motion: the tour stays off
    lampMix = powerAt(state.levelPct, state.t, { doorOpen: state.doorOpen }).on ? 1 : 0;
  }
});
</script></body></html>
