.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

const GLSL_ISO = `precision highp float;
uniform vec2 uCanvas;
uniform vec2 uView;
uniform vec2 uOrigin;
uniform float uK;
uniform vec4 uCam;
uniform float uTime;
vec2 viewOf(vec2 frag){return vec2(frag.x,uCanvas.y-frag.y)*(uView.x/uCanvas.x);}
vec2 project(vec3 p){return uOrigin+uK*vec2(p.x*uCam.x-p.y*uCam.y,(p.x*uCam.y+p.y*uCam.x)*uCam.z-p.z*uCam.w);}
vec3 towardViewer(){return vec3(uCam.y*uCam.w,uCam.x*uCam.w,uCam.z);}
vec3 rayOf(vec2 vb){vec2 q=(vb-uOrigin)/uK;return vec3(q.x*uCam.x,-q.x*uCam.y,-q.y/uCam.w);}
float pixelOf(){return (uView.x/uCanvas.x)/uK;}
vec3 lightDir(){return normalize(vec3(-uCam.x,uCam.y,1.2));}
vec3 onFloor(vec2 vb,float h){vec2 q=(vb-uOrigin)/uK;float b=(q.y+h*uCam.w)/uCam.z;return vec3(q.x*uCam.x+b*uCam.y,-q.x*uCam.y+b*uCam.x,h);}
vec3 onWallY(vec2 vb,float y){vec2 q=(vb-uOrigin)/uK;float x=(q.x+y*uCam.y)/uCam.x;return vec3(x,y,((x*uCam.y+y*uCam.x)*uCam.z-q.y)/uCam.w);}
vec3 onWallX(vec2 vb,float x){vec2 q=(vb-uOrigin)/uK;float y=(x*uCam.x-q.x)/uCam.y;return vec3(x,y,((x*uCam.y+y*uCam.x)*uCam.z-q.y)/uCam.w);}
float hash12(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float hash13(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float noise2(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash12(i),hash12(i+vec2(1.,0.)),f.x),mix(hash12(i+vec2(0.,1.)),hash12(i+vec2(1.,1.)),f.x),f.y);}
float noise3(vec3 p){vec3 i=floor(p);vec3 f=fract(p);f=f*f*(3.-2.*f);
  float a=mix(mix(hash13(i),hash13(i+vec3(1.,0.,0.)),f.x),mix(hash13(i+vec3(0.,1.,0.)),hash13(i+vec3(1.,1.,0.)),f.x),f.y);
  float b=mix(mix(hash13(i+vec3(0.,0.,1.)),hash13(i+vec3(1.,0.,1.)),f.x),mix(hash13(i+vec3(0.,1.,1.)),hash13(i+vec3(1.,1.,1.)),f.x),f.y);
  return mix(a,b,f.z);}
float fbm2(vec2 p){float s=0.;float a=.5;for(int i=0;i<4;i++){s+=a*noise2(p);p=p*2.07+vec2(17.1,9.2);a*=.5;}return s/.9375;}
float fbm3(vec3 p){float s=0.;float a=.5;for(int i=0;i<4;i++){s+=a*noise3(p);p=p*2.07+vec3(17.1,9.2,4.7);a*=.5;}return s/.9375;}
float window(float x,float a,float b,float soft){return smoothstep(a-soft,a+soft,x)*(1.-smoothstep(b-soft,b+soft,x));}
vec3 tonemap(vec3 c,float exposure){return 1.-exp(-c*exposure);}
`;

const GLSL_TURN = `uniform vec3 uGroupX;
uniform vec3 uGroupY;
uniform vec3 uGroupZ;
uniform vec3 uGroupT;
uniform vec3 uCoverEdge[60];
uniform float uCoverCount[6];
vec3 toGroup(vec3 p){vec3 q=p-uGroupT;return vec3(dot(q,uGroupX),dot(q,uGroupY),dot(q,uGroupZ));}
vec3 toWorld(vec3 g){return uGroupT+g.x*uGroupX+g.y*uGroupY+g.z*uGroupZ;}
vec3 dirToGroup(vec3 d){return vec3(dot(d,uGroupX),dot(d,uGroupY),dot(d,uGroupZ));}
vec3 dirToWorld(vec3 d){return d.x*uGroupX+d.y*uGroupY+d.z*uGroupZ;}
float coverOf(vec2 vb,float soft){float c=0.;for(int p=0;p<6;p++){float n=uCoverCount[p];float inside=-1e4;for(int e=0;e<10;e++){if(float(e)>=n)break;vec3 h=uCoverEdge[p*10+e];inside=max(inside,h.x*vb.x+h.y*vb.y+h.z);}if(n>0.)c=max(c,1.-smoothstep(-soft,soft,inside));}return c;}
`;

function glslPose(name, prefix = `u${name}`) {
  return `uniform vec3 ${prefix}X;uniform vec3 ${prefix}Y;uniform vec3 ${prefix}Z;uniform vec3 ${prefix}T;
vec3 to${name}(vec3 p){vec3 q=p-${prefix}T;return vec3(dot(q,${prefix}X),dot(q,${prefix}Y),dot(q,${prefix}Z));}
vec3 from${name}(vec3 g){return ${prefix}T+g.x*${prefix}X+g.y*${prefix}Y+g.z*${prefix}Z;}
vec3 dirTo${name}(vec3 d){return vec3(dot(d,${prefix}X),dot(d,${prefix}Y),dot(d,${prefix}Z));}
vec3 dirFrom${name}(vec3 d){return d.x*${prefix}X+d.y*${prefix}Y+d.z*${prefix}Z;}
`;
}

function glCamera(projection) {
  const a = ((projection.azimuth ?? 45) * Math.PI) / 180;
  const e = ((projection.elevation ?? 30) * Math.PI) / 180;
  return {
    origin: [projection.origin[0], projection.origin[1]],
    k: projection.scale * Math.sqrt(1.6),
    cam: [Math.sin(a), Math.cos(a), Math.sin(e), Math.cos(e)],
  };
}

const VERTEX = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";

function glLayer({ canvas, fragment, view, camera, uniforms = [], fixed = {}, extensions = [], maxRatio = 1.5, onError = (message) => console.error(message) }) {
  const gl = canvas.getContext("webgl", { premultipliedAlpha: true, alpha: true, antialias: false, preserveDrawingBuffer: false });
  if (!gl) return null;
  const compile = (type, source) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
    onError(gl.getShaderInfoLog(shader));
    return null;
  };
  const vs = compile(gl.VERTEX_SHADER, VERTEX);
  const enabled = extensions.filter((name) => gl.getExtension(name.replace(/^GL_/, "")));
  const fs = compile(gl.FRAGMENT_SHADER, enabled.map((name) => `#extension ${name} : enable\n`).join("") + GLSL_ISO + fragment);
  if (!vs || !fs) return null;
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    onError(gl.getProgramInfoLog(program));
    return null;
  }
  gl.useProgram(program);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, "p");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  const where = {};
  for (const name of ["uCanvas", "uView", "uOrigin", "uK", "uCam", "uTime", ...uniforms, ...Object.keys(fixed)]) where[name] = gl.getUniformLocation(program, name);
  const types = {};
  const active = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let index = 0; index < active; index++) {
    const info = gl.getActiveUniform(program, index);
    if (info) types[info.name.replace(/\[0\]$/, "")] = info.type;
  }
  let painted = false;
  const fit = () => {
    const box = canvas.getBoundingClientRect();
    const ratio = Math.min(maxRatio, window.devicePixelRatio || 1);
    const width = Math.max(1, Math.round(box.width * ratio));
    const height = Math.max(1, Math.round(box.height * ratio));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
  };
  const set = (name, value) => {
    const at = where[name];
    if (at === undefined || at === null) return;
    if (typeof value === "number") gl.uniform1f(at, value);
    else if (value.length > 4) {
      const data = value instanceof Float32Array ? value : new Float32Array(value);
      const type = types[name];
      if (type === gl.FLOAT_VEC2) gl.uniform2fv(at, data);
      else if (type === gl.FLOAT_VEC3) gl.uniform3fv(at, data);
      else if (type === gl.FLOAT_VEC4) gl.uniform4fv(at, data);
      else gl.uniform1fv(at, data);
    }
    else if (value.length === 1) gl.uniform1f(at, value[0]);
    else if (value.length === 2) gl.uniform2f(at, value[0], value[1]);
    else if (value.length === 3) gl.uniform3f(at, value[0], value[1], value[2]);
    else if (value.length === 4) gl.uniform4f(at, value[0], value[1], value[2], value[3]);
  };
  for (const [name, value] of Object.entries(fixed)) set(name, value);
  return {
    gl,
    extensions: enabled,
    set(values = {}) {
      for (const [name, value] of Object.entries(values)) set(name, value);
    },
    draw(values = {}, time = 0) {
      fit();
      gl.viewport(0, 0, canvas.width, canvas.height);
      set("uCanvas", [canvas.width, canvas.height]);
      set("uView", view);
      set("uOrigin", camera.origin);
      set("uK", camera.k);
      set("uCam", camera.cam);
      set("uTime", time);
      for (const [name, value] of Object.entries(values)) set(name, value);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      painted = true;
    },
    clear() {
      if (!painted) return;
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      painted = false;
    },
  };
}

const smooth = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

const burst = (age, rise, fall) => (age > 0 ? smooth(0, rise, age) * Math.exp(-Math.max(0, age - rise) / fall) : 0);

function settle(state, target, dt, seconds, calm = false) {
  if (calm) {
    state.x = target;
    state.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let index = 0; index < 4; index++) {
    const h = dt / 4;
    state.v += (w * w * (target - state.x) - 2 * w * state.v) * h;
    state.x += state.v * h;
  }
  if (Math.abs(target - state.x) < 1e-4 && Math.abs(state.v) < 1e-4) {
    state.x = target;
    state.v = 0;
    return false;
  }
  return true;
}

// model.mjs — pure numeric model of a countertop microwave oven.
// No DOM, no Node APIs: importable by build.mjs, the page runtime, and tests.
// Every number the figure shows comes from here (R1).
//
// Time is in seconds (t >= 0 for meaningful results; negatives clamp to 0).
// Power level is one of 100 / 50 / 30 (percent of full microwave power).

// --- Typical constants (R2) -------------------------------------------------
const MICROWAVE_W = 800; // magnetron output when on
const MAINS_W = 1200; // ~ mains draw while the magnetron is on
const FREQUENCY_GHZ = 2.45; // ISM band
const WAVELENGTH_CM = 12.2; // ~ c / 2.45 GHz
const HOTSPOT_SPACING_CM = 6.1; // half wavelength — standing-wave hot spots
const WATER_CP = 4.18; // J/(g·°C), liquid water
const ICE_RATE = 0.1; // ice absorbs 10% of the liquid-water rate
const MELT_J_PER_G = 334; // latent heat of fusion of ice
const DUTY_CYCLE_S = 30; // magnetron duty cycle length
const TURNTABLE_RPM = 5; // ~ turntable speed
const TURNTABLE_PERIOD_S = 12; // one full turn ≈ 12 s

// On-time per 30 s duty cycle for each level (R3). The magnetron is either at
// full MICROWAVE_W or at 0 W — never weakened.
const ON_TIME_S = Object.freeze({ 100: 30, 50: 15, 30: 9 });

const LEVELS = Object.freeze([100, 50, 30]);

// --- Duty-cycle state (R3, R4) ----------------------------------------------

function onTimeFor(level) {
  const on = ON_TIME_S[level];
  if (on === undefined) {
    throw new Error(`unknown power level ${level} (use ${LEVELS.join("/")})`);
  }
  return on;
}

/** Is the magnetron energised at time t? Door interlock kills it entirely. */
function magnetronOn(t, level, doorClosed) {
  if (!doorClosed) return false; // interlock: never on with the door open
  const onTime = onTimeFor(level);
  if (t <= 0) return onTime > 0; // t = 0 sits at the start of the on phase
  return t % DUTY_CYCLE_S < onTime;
}

/** Power delivered to the cavity at time t: MICROWAVE_W or 0, never between. */
function deliveredPower(t, level, doorClosed) {
  return magnetronOn(t, level, doorClosed) ? MICROWAVE_W : 0;
}

/** ~ Mains draw at time t: MAINS_W while the magnetron is on, else 0. */
function mainsPower(t, level, doorClosed) {
  return magnetronOn(t, level, doorClosed) ? MAINS_W : 0;
}

/**
 * Cumulative energy delivered to the food/cavity over [0, t], assuming the
 * given level and door state held the whole time (J).
 * Door open at any call => 0 (R4: a mid-cycle open adds no further heat; the
 * caller tracks when the door opened by integrating in segments).
 */
function energyDelivered(t, level, doorClosed) {
  if (!doorClosed || t <= 0) return 0;
  const onTime = onTimeFor(level);
  const cycles = Math.floor(t / DUTY_CYCLE_S);
  const rem = t - cycles * DUTY_CYCLE_S;
  return MICROWAVE_W * (cycles * onTime + Math.min(rem, onTime));
}

// --- Cavity standing wave + turntable (R9, R10) ------------------------------

/**
 * Field strength along the long cavity-floor axis, x in cm from a hot spot.
 * A standing wave |E(x)|^2 = cos^2(2πx/λ): maxima every λ/2 ≈ 6.1 cm, deep
 * nulls halfway between. Normalised to 1 at a maximum, 0 at a null. The
 * figure draws this as bands on the cavity floor; food at a fixed point
 * samples it (hot spots heat faster, nulls stay cold — R9).
 */
function fieldStrength(xCm) {
  const c = Math.cos((Math.PI * xCm) / HOTSPOT_SPACING_CM); // period = λ/2
  return c * c;
}

/**
 * Turntable angle in radians at time t. One full turn per TURNTABLE_PERIOD_S
 * (~12 s, ~5 rpm) while on; while off the food keeps a fixed angle
 * (startAngle, default 0) in the pattern (R10).
 */
function turntableAngle(t, on, startAngle = 0) {
  if (!on) return startAngle;
  return startAngle + (2 * Math.PI * Math.max(0, t)) / TURNTABLE_PERIOD_S;
}

/** Field sampled by food at `angle` on a circle of `radiusCm` (x = r·cosθ). */
function foodField(angle, radiusCm) {
  return fieldStrength(radiusCm * Math.cos(angle));
}

/**
 * Circle-averaged field over one turn at `radiusCm` — the turntable's
 * even-heating claim: the food sweeps hot spots and nulls alike, so its
 * average lands between them instead of at a single hot spot.
 */
function averageField(radiusCm, samples = 360) {
  let sum = 0;
  for (let i = 0; i < samples; i++) sum += foodField((2 * Math.PI * i) / samples, radiusCm);
  return sum / samples;
}

// --- Food state (R5–R7) ------------------------------------------------------

// What can be inside the cavity. startC is the food's starting temperature
// (the frozen block comes straight from a freezer at -18 °C).
const CONTENTS = Object.freeze({
  water: Object.freeze({ label: "cup of water", kind: "liquid", massG: 250, startC: 20 }),
  dish: Object.freeze({ label: "empty ceramic dish", kind: "inert", massG: 400, startC: 20 }),
  frozen: Object.freeze({ label: "frozen block", kind: "frozen", massG: 250, startC: -18 }),
});

const BOIL_C = 100; // liquid water is capped here (R5)

/**
 * Food state after running the oven for t seconds.
 *
 * doorClosed: true | false | number. A number is the moment (seconds) the
 * door was opened mid-run: energy stops accumulating there and nothing after
 * adds heat (R8). turntableOn is carried through for the figure; totals do
 * not depend on it (spatial sampling arrives with fieldStrength in T005).
 *
 * Returns { contents, level, t, startC, energyJ, foodEnergyJ, tempC,
 * meltedShare, state, turntableOn }. energyJ is what the magnetron delivered
 * into the cavity; foodEnergyJ is what the food actually absorbed.
 * meltedShare is 0..1 for the frozen block and null otherwise; state is
 * "ice" | "melting" | "water" for frozen, "liquid" | "inert" otherwise.
 *
 * Frozen block (R6): below 0 °C it warms at ICE_RATE (10%) of the liquid
 * water rate — the figure's stated assumption. At 0 °C it plateaus while the
 * melt consumes MELT_J_PER_G per gram (share = E_melt / (mass·334)); energy
 * spent melting never also raises the temperature. Once share = 1 the
 * meltwater heats as liquid water, capped at BOIL_C.
 */
function simulate({ contents, level, doorClosed, turntableOn = true, t } = {}) {
  const spec = CONTENTS[contents];
  if (!spec) {
    throw new Error(`unknown contents "${contents}" (use ${Object.keys(CONTENTS).join("/")})`);
  }
  onTimeFor(level); // validate level (throws on unknown)

  const elapsed = Math.max(0, t); // negative/zero t -> initial state (R8)
  const openAt = typeof doorClosed === "number" ? Math.max(0, doorClosed) : null;
  const runT = openAt !== null ? Math.min(elapsed, openAt) : elapsed;
  const doorWasClosed = openAt !== null ? true : !!doorClosed;

  const energyJ = energyDelivered(runT, level, doorWasClosed);

  let foodEnergyJ, tempC, meltedShare, state;
  if (spec.kind === "frozen") {
    // Closed-form phase path: warm ice -> 0 °C plateau -> liquid (R6).
    foodEnergyJ = energyJ;
    const eWarm = spec.massG * (ICE_RATE * WATER_CP) * (0 - spec.startC); // to 0 °C
    const eMelt = spec.massG * MELT_J_PER_G; // 0 °C ice -> 0 °C water
    if (energyJ <= eWarm) {
      tempC = spec.startC + energyJ / (spec.massG * ICE_RATE * WATER_CP);
      meltedShare = 0;
      state = "ice";
    } else if (energyJ < eWarm + eMelt) {
      tempC = 0; // plateau: melting takes every joule, temperature pinned
      meltedShare = (energyJ - eWarm) / eMelt;
      state = "melting";
    } else {
      tempC = Math.min(BOIL_C, (energyJ - eWarm - eMelt) / (spec.massG * WATER_CP));
      meltedShare = 1;
      state = "water";
    }
  } else if (spec.kind === "liquid") {
    // Energy balance: ΔT = E/(mass·cp), capped at boiling (R5).
    foodEnergyJ = energyJ;
    tempC = Math.min(BOIL_C, spec.startC + energyJ / (spec.massG * WATER_CP));
    meltedShare = null;
    state = "liquid";
  } else {
    // Empty ceramic dish absorbs almost nothing (R7).
    foodEnergyJ = 0;
    tempC = spec.startC;
    meltedShare = null;
    state = "inert";
  }

  return {
    contents,
    level,
    t: elapsed,
    startC: spec.startC,
    energyJ,
    foodEnergyJ,
    tempC,
    meltedShare,
    state,
    turntableOn: !!turntableOn,
  };
}

    layer = glLayer({

      fragment: cfg.fragment,
      view: [cfg.W, cfg.H],
      camera: cfg.camera,
      uniforms: ["uLevel", "uAnt"],
      fixed: { uLight: host.light(), FLOOR: cfg.floor, DISC: cfg.disc, ANT: cfg.ant, AP: cfg.ap, HOLE: cfg.hole, Y1: cfg.apY, Y2: cfg.holeY },

      meltInner.setAttribute("transform", "translate(" + cx.toFixed(1) + " " + cy.toFixed(1) + ") scale(" + k2.toFixed(3) + ") translate(" + (-cx).toFixed(1) + " " + (-cy).toFixed(1) + ")");
    } else meltInner.removeAttribute("transform");
    for (const el of facetEls) el.setAttribute("opacity", Math.max(0, 1 - share * 1.4).toFixed(2));
  }
}

function draw(t) {
  const dt = Math.max(0, Math.min(t - lastT, 0.1));
  lastT = t;
  const angle = turntableAngle(t, state.turntable);
  const point = [TT[0] + TT_R * Math.cos(angle), TT[1] + TT_R * Math.sin(angle), TT[3]];
  const [sx, sy] = iso(point, P);
  marker.setAttribute("cx", sx.toFixed(1));
  marker.setAttribute("cy", sy.toFixed(1));
  // R14 fields; every number from the inlined model, read through the
  // reader's state (R11). Door open => model gets doorClosed=false (R4):
  // a number = the moment it opened mid-run, so heat stops accumulating.
  const doorClosed = state.door ? doorOpenedAt : true;
  if (motion) motion.update(t, state, doorClosed);
  // The tour may have changed state during update(); re-read so the readout
  // never shows a frame behind the figure.
  const dc = state.door ? doorOpenedAt : true;
  // T020: the single WebGL layer rides the same flowState envelope. Never
  // drawn under prefers-reduced-motion (the still frame stays pure SVG).
  if (gl && !still.matches) gl.update(t, dt, motion ? motion.flowState(t, state.level, dc) : { on: false, intensity: 0 });
  const s = simulate({ contents: state.contents, level: state.level, doorClosed: dc, turntableOn: state.turntable, t });
  setField("ro-level", state.level + "%");
  setField("ro-mag", magnetronOn(t, state.level, !state.door) ? "on" : "off");
  setField("ro-time", t.toFixed(1) + "s");
  setField("ro-energy", fmtEnergy(s.energyJ));
  setField("ro-temp", s.tempC.toFixed(1) + "\u00b0C");
  setField("ro-melt", s.meltedShare > 0 && s.meltedShare < 1 ? Math.round(s.meltedShare * 100) + "%" : "\u2014");
  setFoodState(s, dc, t); // T019: food colour/steam/shrink + band brightness
}

function tick(now) {
  if (timeLock !== null) { frame = 0; return; }
  if (t0 === null) t0 = now;
  window.__ticks++;
  draw((now - t0) / 1000);
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}

// --- R12 idle tour hook: the tour drives the same values the reader's
// controls set, but without arming takeOver. applyControlValue(name, value)
// sets one field; setControl(name) cycles it (reader path, arms takeOver).
function applyControlValue(name, value) {
  if (name === "level") { if (LEVELS.indexOf(value) < 0) return; state.level = value; }
  else if (name === "contents") { if (!CONTENTS[value]) return; state.contents = value; }
  else if (name === "turntable") state.turntable = !!value;
  else if (name === "door") {
    state.door = !!value;
    if (state.door) doorOpenedAt = lastT; // opened mid-cycle: heat stops there
  } else return;
  syncControls();
  draw(lastT);
}

// --- R11 live state: one object; every control mutates exactly one field.
// The figure and the readout both read from it. window hooks let tests (and
// the idle tour in T017) see it.
const state = { level: LEVELS[0], contents: "water", turntable: true, door: false };
window.__microwaveState = state;
let readerPresent = false;
window.__readerPresent = false;
let doorOpenedAt = 0; // moment (s) the door opened mid-run (R4/R8)
let lastT = 0;
function takeOver() {
  if (readerPresent) return;
  readerPresent = true;
  window.__readerPresent = true; // T017: the idle tour stops on this
}

const CONTENTS_KEYS = Object.keys(CONTENTS);
const ctlButtons = Array.from(document.querySelectorAll(".iso-ctl"));
const KEY_CONTROL = {};
for (const btn of ctlButtons) KEY_CONTROL[btn.dataset.key.toLowerCase()] = btn.dataset.control;

function controlText(name) {
  if (name === "level") return "Level " + state.level + "%";
  if (name === "contents") return "Contents: " + CONTENTS[state.contents].label;
  if (name === "turntable") return "Turntable " + (state.turntable ? "on" : "off");
  return "Door " + (state.door ? "open" : "closed");
}
function syncControls() {
  for (const btn of ctlButtons) {
    const text = controlText(btn.dataset.control);
    btn.textContent = text;
    btn.setAttribute("aria-label", text + ", press to change");
  }
}
function setControl(name) {
  takeOver();
  if (name === "level") applyControlValue("level", LEVELS[(LEVELS.indexOf(state.level) + 1) % LEVELS.length]);
  else if (name === "contents") applyControlValue("contents", CONTENTS_KEYS[(CONTENTS_KEYS.indexOf(state.contents) + 1) % CONTENTS_KEYS.length]);
  else if (name === "turntable") applyControlValue("turntable", !state.turntable);
  else if (name === "door") applyControlValue("door", !state.door);
}

for (const btn of ctlButtons) {
  btn.addEventListener("click", () => setControl(btn.dataset.control));
  // Keyboard activation of a focused button. preventDefault keeps a real
  // browser's native click from double-firing the same cycle.
  btn.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      setControl(btn.dataset.control);
    }
  });
}
stage.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.key.length > 1) return;
  const name = KEY_CONTROL[e.key.toLowerCase()];
  if (name) { e.preventDefault(); setControl(name); }
});
// Any input arms "reader is present" (R12 pre-work).
for (const type of ["pointerdown", "keydown"]) document.addEventListener(type, takeOver, { passive: true });

const run = () => { if (timeLock === null && !frame && visible && !still.matches) { frame = requestAnimationFrame(tick); } };
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run(); else if (frame) { cancelAnimationFrame(frame); frame = 0; }
}, { rootMargin: "120px 0px" }).observe(stage);

// --- T017 motion: energy flow, turntable rotation, door swing, idle tour.
// createMotion reads the model globals inlined above; host gives it the
// live state without owning it.
motion = createMotion(MOTION_CFG, {
  svg: svg,
  P: P,
  getState: () => state,
  getT: () => lastT,
  doorOpenedAt: () => doorOpenedAt,
  calm: () => still.matches,
  readerPresent: () => readerPresent,
  set: applyControlValue,
});

// T020: one WebGL layer (the cavity field shimmer + antenna glow). Created
// only when motion exists; createGlLayer skips it under reduced motion and
// falls back silently (SVG alone) when WebGL is missing.
gl = createGlLayer(stage, GL_CFG, {
  calm: () => still.matches,
  light: () => (document.body.dataset.theme === "light" ? 1 : 0),
});
window.__glLive = () => (gl ? gl.live() : { active: false, level: 0 });

// Test hooks (T017 checks; flowState is a pure function of model time).
// __setTime(t) (T019) freezes the rAF loop and draws at an exact model time
// so a test can compare the DOM against simulate(t) with no race.
window.__setTime = (t) => {
  timeLock = t;
  if (frame) { cancelAnimationFrame(frame); frame = 0; }
  draw(t);
};
window.__flowState = (t, level, doorClosed) => motion.flowState(t, level, doorClosed);
window.__flowLive = () => motion.live();
window.__setControl = (name, value) => applyControlValue(name, value);
window.__tourActive = () => motion.tourActive();

syncControls();
// R13: reduced motion gets exactly one still frame at STILL_T and never
// loops (run() refuses to start while still.matches; the tour is disabled
// in createMotion when host.calm() is true). The readout shows this
// frame's values. Any future WebGL layer must render only while the rAF
// loop runs (T020).
draw(still.matches ? STILL_T : 0);
run();
if (still.addEventListener) still.addEventListener("change", () => {
  if (frame) { cancelAnimationFrame(frame); frame = 0; }
  draw(still.matches ? STILL_T : 0);
  run();
});
</script></body></html>
