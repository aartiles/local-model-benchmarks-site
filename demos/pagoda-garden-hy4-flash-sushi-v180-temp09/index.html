<script>
(() => {
'use strict';
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d', { alpha:false });
const off = document.createElement('canvas');
const octx = off.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 12, OX = 0, OY = 0;
const state = { a:-2.30, e:0.60, zoom:1, auto:true, day:true, petals:true, dirty:true };
const CX = 2, CY = 3, CZ = 15;

/* ---------- deterministic helpers ---------- */
function hash(x, y, z, s) {
  let h = ((x|0) * 374761393 + (y|0) * 668265263 + (z|0) * 1442695041 + (s|0) * 1274126177) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
let seed = 987654321;
function rnd() { seed = (Math.imul(seed, 1664525) + 1013904223) | 0; return (seed >>> 0) / 4294967296; }
function pick(a, x, y, z, s) { return a[Math.floor(hash(x, y, z, s || 0) * a.length)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
const k3 = (x,y,z) => x + ',' + y + ',' + z;
const k2 = (x,y) => x + ',' + y;

/* ---------- voxel store ---------- */
const V = new Map();
const VLIST = [];
function put(x, y, z, c, t) {
  x = x|0; y = y|0; z = z|0; t = t || 0;
  const key = k3(x,y,z), old = V.get(key);
  if (old) { old.c = c; old.t = t; }
  else { const o = {x,y,z,c,t}; V.set(key, o); VLIST.push(o); }
}
function groundAt(x, y) { const h = HMAP.get(k2(x,y)); return h === undefined ? 0 : h; }

/* ---------- palettes ---------- */
const C = {
  grass:  [0x4d8d3f, 0x599b45, 0x3f7c3a, 0x65a54b, 0x37744f, 0x74ae56],
  earth:  [0x6b5338, 0x795c3d, 0x5e4834, 0x826845],
  rock:   [0x465860, 0x53676d, 0x3a4c56, 0x5f7075, 0x334752],
  path:   [0xa9a79b, 0xc0bcae, 0x979b91, 0xd0c9b5, 0x8f938b],
  wall:   [0xc8c4b5, 0xd4d0c1, 0xb9b6aa, 0xddd8c7],
  wood:   0x5c3526, woodDark:0x3d251d, pillar:0xaa3131,
  gold:   0xe5b64f, goldLight:0xffdc82, tile:[0x1e5361,0x256775,0x1a4857,0x2d7c86,0x16404f],
  pink:   [0xf5a5c4, 0xffc3da, 0xe986ae, 0xffd8e8, 0xd9709b, 0xf6b4d2],
  flower: [0xff5d78, 0xffd23f, 0xa76bea, 0x57d7f2, 0xff8fbe, 0xffffff, 0xff9147],
};
const HMAP = new Map();

/* ---------- shading cache ---------- */
const shadeCache = new Map();
function shadeStr(c, f, glow) {
  const key = (glow ? 'g' : 's') + c + '|' + Math.round(f*40);
  let out = shadeCache.get(key);
  if (out) return out;
  let r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
  if (glow) { r = Math.min(255, r*1.05 + 48); g = Math.min(255, g*1.05 + 32); b = Math.min(255, b + 26); }
  else if (!state.day) { r *= 0.52; g *= 0.62; b *= 0.92; }
  else { b *= 1.02; }
  r = clamp(Math.round(r * f), 0, 255);
  g = clamp(Math.round(g * f), 0, 255);
  b = clamp(Math.round(b * f), 0, 255);
  out = 'rgb(' + r + ',' + g + ',' + b + ')';
  shadeCache.set(key, out);
  return out;
}
function lightFor(o, face) {
  const night = state.day ? 1 : 0.68;
  const n = 0.94 + hash(o.x, o.y, o.z, face*31) * 0.12;
  const f = face === 0 ? 1.06 : face === 1 ? 0.90 : face === 2 ? 0.60 : face === 3 ? 0.99 : 0.55;
  return f * n * night;
}

/* ============================================================
   WORLD CONSTRUCTION
   ============================================================ */
function inIsland(x, y) {
  const q = Math.pow(Math.abs(x)/34, 4) + Math.pow(Math.abs(y)/27, 4);
  return q <= 1;
}
function pondValue(x, y) {
  const dx = (x-22)/11, dy = (y-12)/8;
  return dx*dx + dy*dy;
}
function genTerrain() {
  for (let x = -34; x <= 34; x++) for (let y = -27; y <= 27; y++) {
    if (!inIsland(x, y)) continue;
    const q = Math.pow(Math.abs(x)/34, 4) + Math.pow(Math.abs(y)/27, 4);
    const p = pondValue(x, y);
    let h = Math.round(Math.sin(x*0.31)*Math.cos(y*0.27)*0.55 + (q > 0.84 ? -1 : 0));
    if (p < 1) h = -2;
    HMAP.set(k2(x,y), h);
    if (p < 1) {
      put(x, y, -3, 0x243b4a);
      put(x, y, -2, p < 0.55 ? 0x16445c : 0x1b5671);
      put(x, y, -1, 0x1d6d92);
      put(x, y,  0, pick([0x2e8fc0,0x2581b2,0x379bd0,0x1f74a6], x,y,0,7), 1);
    } else {
      const shore = p < 1.38;
      const top = shore ? pick([0xb9ae8c,0xc9bf9a,0xa9a281,0xd2c6a1], x,y,0,2)
                        : pick(C.grass, x,y,0,1);
      put(x, y, h, top);
      put(x, y, h-1, pick(C.earth, x,y,0,3));
      const edge = q > 0.68 || p < 1.38 ||
        !inIsland(x-1,y) || !inIsland(x+1,y) || !inIsland(x,y-1) || !inIsland(x,y+1);
      if (edge) {
        for (let z = h-2; z >= -4; z--) put(x, y, z, pick(C.rock, x,y,z,5));
      }
    }
  }
  // small beaches / reeds at pond rim
  for (let x = 8; x <= 33; x++) for (let y = 3; y <= 23; y++) {
    const p = pondValue(x, y);
    if (p > 1.0 && p < 1.26 && !V.has(k3(x,y,0)) && rnd() < 0.5) {
      put(x, y, 1, pick([0x6f8d46,0x86a752,0x5e7f43],x,y,0), 0);
    }
  }
}
function genPlaza() {
  // Octagonal stone terrace, three terraced steps.
  for (let level = 0; level < 2; level++) {
    const r = 12 - level, cut = 19 - level*2;
    for (let x = -r; x <= r; x++) for (let y = -r; y <= r; y++) {
      const ax = Math.abs(x), ay = Math.abs(y);
      if (ax + ay > cut) continue;
      for (let z = 0; z <= level+1; z++)
        put(x, y, z, pick(C.path, x,y,z,11), 0);
    }
  }
  for (let x = -10; x <= 10; x++) for (let y = -10; y <= 10; y++) {
    if (Math.abs(x)+Math.abs(y) > 17) continue;
    put(x, y, 3, ((x+y) & 1) ? 0xbdb8a9 : 0xd0c9b7, 0);
    if (((x*7+y*3) % 11) === 0) put(x, y, 3, 0x9c9d96);
  }
  // stair approach
  for (let y = 15; y >= 11; y--) {
    const top = 4 - (y - 11);
    for (let x = -3; x <= 3; x++) {
      for (let z = 0; z <= top; z++) put(x, y, z, pick(C.path,x,y,z,13));
      if (Math.abs(x) === 3) {
        put(x, y, top+1, 0x9ca4a0);
        put(x, y, top+2, 0xc3c6bc);
      }
    }
  }
  // winding stepping-stone path towards the gate
  for (let y = 26; y >= 16; y--) {
    const bx = Math.round(1.6 * Math.sin((y-3)*0.2));
    for (let w = -1; w <= 1; w++) {
      const x = bx + w, h = groundAt(x,y);
      put(x, y, h, pick(C.path,x,y,0,17));
      if ((y + x) % 3 === 0) put(x, y, h, 0x8f9189);
    }
  }
  // lantern-lined path borders
  for (let y = 18; y <= 25; y += 3) {
    const bx = Math.round(1.6 * Math.sin((y-3)*0.2));
    put(bx-3, y, groundAt(bx-3,y)+1, 0x719452);
    put(bx+3, y, groundAt(bx+3,y)+1, 0x719452);
  }
}
function genBridge() {
  for (let y = 7; y <= 17; y++) {
    const arch = 1 + Math.round(1.5 * (1 - Math.abs(y-12)/6));
    for (let x = 21; x <= 23; x++) {
      put(x, y, arch, ((x+y) & 1) ? 0x8d5b37 : 0x9c6941);
    }
    for (const rx of [20, 24]) {
      put(rx, y, arch+1, 0x9f3030);
      if (y % 2 === 0) put(rx, y, arch+2, 0xd24a42);
    }
  }
  for (const y of [7, 17]) {
    for (let x = 20; x <= 24; x++) put(x, y, 4, 0xb33936);
    put(22, y, 5, 0xff9147, 2);
    put(22, y, 6, C.gold, 2);
  }
  // lily pads and blossoms
  for (const [lx,ly] of [[15,10],[26,17],[17,18],[27,9]]) {
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      if (Math.abs(dx)+Math.abs(dy) === 2) continue;
      put(lx+dx, ly+dy, 1, pick([0x4e9a5a,0x3e884c,0x66ad60],lx+dx,ly+dy,0));
    }
    put(lx, ly, 2, 0xffb7d4, 2);
    put(lx, ly, 3, 0xffe1ef, 2);
  }
}

/* ============================================================
   THE PAGODA — five diminishing tiers with flared glazed roofs
   ============================================================ */
function genPagoda() {
  const radii = [8,7,6,5,4];
  for (let t = 0; t < 5; t++) {
    const r = radii[t], dz = 6 + t*5, R = r + 2, eave = dz + 4;
    // balcony deck + under-beams
    for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) {
      const ax = Math.abs(dx), ay = Math.abs(dy);
      if (ax + ay > r + Math.floor(r/2)) continue;
      put(dx, dy, dz, ((dx+dy) & 1) ? 0x70452f : 0x7e5034);
      if (ax === r || ay === r) {
        put(dx, dy, dz-1, C.woodDark);
        if ((dx+dy) % 2 === 0) put(dx, dy, dz+1, C.gold);
      }
    }
    // red pillars and corner posts
    for (let d = -r; d <= r; d++) {
      const spots = [];
      if (d === -r || d === r || d === 0 || d % 3 === 0) {
        spots.push([d,r],[d,-r],[r,d],[-r,d]);
      }
      for (const [px,py] of spots) {
        for (let z = dz+1; z <= dz+3; z++) put(px, py, z, C.pillar);
        put(px, py, dz+4, C.gold);
        put(px, py, dz+2, 0x8d2525);
      }
    }
    // paper-screen walls with dark timber lattice
    for (let d = -r+1; d <= r-1; d++) {
      for (const side of [-1, 1]) {
        if (d % 4 !== 0 && d % 4 !== 1 && d % 4 !== 2) continue;
        for (const z of [dz+1, dz+2]) {
          const c = pick(C.wall, d, side, z, t);
          put(d, side*r, z, c); put(side*r, d, z, c);
        }
        if (d % 4 === 1) {
          put(d, side*r, dz+3, C.woodDark); put(side*r, d, dz+3, C.woodDark);
        }
      }
    }
    // flared hip roof
    for (let dx = -R; dx <= R; dx++) for (let dy = -R; dy <= R; dy++) {
      const ax = Math.abs(dx), ay = Math.abs(dy);
      const m = Math.max(ax, ay);
      let lift = 0;
      if (ax >= R-1 && ay >= R-1) lift = (ax === R && ay === R) ? 2 : 1;
      const slope = Math.round(2.4 * (1 - m/R));
      const h = eave + slope + lift;
      const tile = pick(C.tile, dx, dy, t, 37);
      put(dx, dy, h-1, tile);
      put(dx, dy, h, m === R ? (lift ? C.gold : 0x163d4a) : tile);
      if (m < 2) put(dx, dy, h+1, 0x163546);
      if ((dx === 0 || dy === 0) && m > 1 && m < R-1) put(dx, dy, h+1, 0x327987);
      // golden rim along the eaves
      if (m === R && (dx % 2 === 0 || dy % 2 === 0) && lift === 1) put(dx, dy, h, C.gold);
    }
    // hanging lanterns and corner bells
    for (let k = -R+2; k <= R-2; k++) {
      for (const s of [-1,1]) {
        if (k % 3 === 0) {
          put(k, s*R, eave-1, 0xff6b45, 2);
          put(k, s*R, eave, C.gold);
          put(s*R, k, eave-1, 0xff8050, 2);
          put(s*R, k, eave, C.gold);
        }
      }
    }
    for (const sx of [-1,1]) for (const sy of [-1,1]) {
      put(sx*R, sy*R, eave+3, C.gold);
      put(sx*R, sy*R, eave+2, C.goldLight, 2);
      put(sx*(R-1), sy*(R-1), eave+1, C.gold);
    }
  }
  // golden finial: stacked rings, jewel and needle
  const base = 34;
  put(0,0,base, C.gold);
  put(0,0,base+1, C.goldLight, 2);
  for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) {
    put(x,y,base-1, C.gold);
    put(x,y,base+2, C.gold);
  }
  put(0,0,base+3, 0xff5e70, 2);
  put(0,0,base+4, C.goldLight, 2);
  put(0,0,base+5, C.gold);
  put(0,0,base+6, 0xffe9a8, 2);
  // prayer banners flanking the front stair
  for (const x of [-4, 4]) {
    for (let z = 5; z <= 11; z++) put(x, 11, z, z % 2 ? 0xd93b4d : 0xba2e47);
    put(x, 11, 12, C.gold);
    put(x, 12, 5, C.woodDark);
  }
}

/* ============================================================
   TREES, SHRUBS AND GARDEN ORNAMENTS
   ============================================================ */
function line3(x0,y0,z0,x1,y1,z1,color) {
  const n = Math.max(Math.abs(x1-x0), Math.abs(y1-y0), Math.abs(z1-z0));
  for (let i = 0; i <= n; i++) {
    const t = n ? i/n : 0;
    put(Math.round(x0+(x1-x0)*t), Math.round(y0+(y1-y0)*t), Math.round(z0+(z1-z0)*t), color);
  }
}
function blob(cx, cy, cz, rx, ry, rz, colors, salt, holes) {
  for (let x = Math.ceil(cx-rx); x <= Math.floor(cx+rx); x++)
    for (let y = Math.ceil(cy-ry); y <= Math.floor(cy+ry); y++)
      for (let z = Math.ceil(cz-rz); z <= Math.floor(cz+rz); z++) {
        const q = ((x-cx)/rx)**2 + ((y-cy)/ry)**2 + ((z-cz)/rz)**2;
        if (q > 1) continue;
        if (holes && hash(x,y,z,salt) < 0.11) continue;
        let c = pick(colors, x,y,z, salt);
        if (z > cz && hash(x,y,z,salt+9) > 0.65) c = 0xffd9ea;
        put(x,y,z,c);
      }
}
function cherryTree(cx, cy, size, salt) {
  const g = groundAt(cx, cy), h = Math.round(5*size);
  const bark = pick([0x654236,0x754b3b,0x5b3a30],cx,cy,g,salt);
  for (let z = g; z <= g+h; z++) {
    const lean = Math.round((z-g)/h * 1.2);
    put(cx + lean*0.0, cy, z, bark);
    put(cx, cy+lean, z, bark);
  }
  const crown = g + h + 2;
  const arms = [[2,1,2],[-2,1,2],[1,-2,2],[-1,-2,3],[2,2,1],[-2,-2,1]];
  for (const [dx,dy,dz] of arms) {
    line3(cx, cy, g+h-1, cx+dx, cy+dy, crown+dz, bark);
    line3(cx+dx, cy+dy, crown+dz, cx+dx*2, cy+dy*2, crown+dz+1, bark);
  }
  blob(cx, cy, crown+2, 3.6*size, 3.4*size, 2.6*size, C.pink, salt, true);
  blob(cx-3, cy+1, crown+1, 2.7*size, 2.6*size, 2.1*size, C.pink, salt+3, true);
  blob(cx+3, cy-1, crown+1, 2.6*size, 2.8*size, 2.1*size, C.pink, salt+5, true);
  blob(cx+1, cy+3, crown, 2.1*size, 2.1*size, 1.8*size, C.pink, salt+7, true);
  for (let i = 0; i < 18; i++) {
    const a = rnd()*Math.PI*2, rr = 4 + rnd()*2;
    const px = cx + Math.round(Math.cos(a)*rr), py = cy + Math.round(Math.sin(a)*rr);
    put(px, py, groundAt(px,py)+1, pick([0xffc6dd,0xf3a4c5,0xffdceb],px,py,0,salt));

    const grad = ctx.createRadialGradient(q[0],q[1],0,q[0],q[1],rad);
    const a = state.day ? 0.16 : 0.46;
    grad.addColorStop(0, 'rgba(255,197,105,'+a+')');
    grad.addColorStop(0.4, 'rgba(255,128,80,'+(a*0.4)+')');
    grad.addColorStop(1, 'rgba(255,110,70,0)');
    ctx.fillStyle = grad; ctx.fillRect(q[0]-rad,q[1]-rad,rad*2,rad*2);
  }
  ctx.restore();
}
function drawPetals(t, dt) {
  if (!state.petals) return;
  for (const p of petals) {
    p.z -= p.sp*dt*1.5;
    p.x += Math.sin(t*0.9+p.ph)*dt*0.75;
    p.y += Math.cos(t*0.7+p.ph)*dt*0.55;
    if (p.z < 0.6) resetPetal(p, false);
    const q = rawP(p.x,p.y,p.z);
    if (q[0]<0||q[0]>W||q[1]<0||q[1]>H) continue;
    const sz = Math.max(2, S*0.34*p.size);
    ctx.save();
    ctx.translate(q[0], q[1]);
    ctx.rotate(t*1.3+p.ph);
    ctx.globalAlpha = p.al;
    ctx.fillStyle = hash(p.ph,p.z,0,4)>0.5 ? '#ffc0da' : '#f6a1c4';
    ctx.beginPath();
    ctx.moveTo(0,-sz); ctx.quadraticCurveTo(sz*0.9,-sz*0.35,0,sz*0.9);
    ctx.quadraticCurveTo(-sz*0.9,-sz*0.35,0,-sz); ctx.fill();
    ctx.globalAlpha = p.al*0.6;
    ctx.fillStyle = '#fff0f6';
    ctx.fillRect(-sz*0.12,-sz*0.25,sz*0.36,sz*0.36);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function drawFireflies(t) {
  const alpha = state.day ? 0.16 : 0.9;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (const f of fireflies) {
    const fx = f.x + Math.sin(t*f.s+f.p)*1.7;
    const fy = f.y + Math.cos(t*f.s*0.8+f.p)*1.7;
    const fz = f.z + Math.sin(t*1.3+f.p)*0.8;
    const q = rawP(fx,fy,fz);
    if (q[0]<0||q[0]>W||q[1]<0||q[1]>H) continue;
    const pulse = 0.35+0.65*Math.max(0,Math.sin(t*2.4+f.p));
    const r = Math.max(4, S*0.75)*pulse;
    const g = ctx.createRadialGradient(q[0],q[1],0,q[0],q[1],r);
    g.addColorStop(0,'rgba(255,247,180,'+(alpha*pulse)+')');
    g.addColorStop(1,'rgba(255,220,120,0)');
    ctx.fillStyle=g; ctx.fillRect(q[0]-r,q[1]-r,r*2,r*2);
  }
  ctx.restore();
}

/* ============================================================
   BOOTSTRAP, CONTROLS AND MAIN LOOP
   ============================================================ */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(320, Math.floor(window.innerWidth * DPR));
  H = Math.max(320, Math.floor(window.innerHeight * DPR));
  cv.width = W; cv.height = H; off.width = W; off.height = H;
  makeGradients();
  state.dirty = true;
}
function setButton(el, on) { el.classList.toggle('on', !!on); }
const bRotate = document.getElementById('bRotate');
const bDay = document.getElementById('bDay');
const bPetals = document.getElementById('bPetals');
bRotate.onclick = () => { state.auto = !state.auto; setButton(bRotate, state.auto); };
bDay.onclick = () => {
  state.day = !state.day; setButton(bDay, !state.day);
  shadeCache.clear(); makeGradients(); state.dirty = true;
};
bPetals.onclick = () => { state.petals = !state.petals; setButton(bPetals, state.petals); };
document.getElementById('bReset').onclick = () => {
  state.a = -2.30; state.e = 0.60; state.zoom = 1; state.dirty = true;
};
document.getElementById('bSave').onclick = () => {
  const a = document.createElement('a');
  a.download = 'sakura-pagoda-voxel-garden.png';
  a.href = cv.toDataURL('image/png'); a.click();
};
let dragging = false, lastX = 0, lastY = 0;
cv.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  state.a -= (e.clientX-lastX)*0.007;
  state.e = clamp(state.e - (e.clientY-lastY)*0.005, 0.24, 1.16);
  lastX = e.clientX; lastY = e.clientY; state.dirty = true;
});
const endDrag = () => { dragging = false; cv.classList.remove('dragging'); };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  state.zoom = clamp(state.zoom * Math.exp(-e.deltaY*0.0011), 0.48, 2.4);
  state.dirty = true;
}, {passive:false});
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); bRotate.click(); }
  else if (k === 'd') bDay.click();
  else if (k === 'p') bPetals.click();
  else if (k === 'r') document.getElementById('bReset').click();
  else if (k === 's') document.getElementById('bSave').click();
});
window.addEventListener('resize', resize);

/* build the world once */
genTerrain();
genPlaza();
genBridge();
genPagoda();
const cherryTrees = genGarden();
collectEffects(cherryTrees);
resize();

let time = 0, last = performance.now(), fpsT = 0, fpsN = 0, fps = 0;
const stat = document.getElementById('stat');
function frame(now) {
  const dt = Math.min(0.06, (now-last)/1000);
  last = now; time += dt;
  if (state.auto && !dragging) { state.a += dt*0.075; state.dirty = true; }
  if (state.dirty) { updateCam(); buildFaces(); state.dirty = false; }
  drawSky(time);
  ctx.drawImage(off, 0, 0);
  drawGlows(time);
  drawSparkles(time);
  drawFish(time);
  drawPetals(time, dt);
  drawFireflies(time);
  ctx.fillStyle = vignetteGrad; ctx.fillRect(0,0,W,H);
  fpsN++; fpsT += dt;
  if (fpsT > 0.5) {
    fps = Math.round(fpsN/fpsT); fpsT = 0; fpsN = 0;
    stat.textContent = VLIST.length.toLocaleString() + ' voxels · ' +
      faces.length.toLocaleString() + ' faces · ' + fps + ' fps' + (state.day ? '' : ' · night');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
