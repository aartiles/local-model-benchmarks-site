  <body>
    <!-- The playable stage. src/main.js renders a WebGL scene into this canvas. -->
    <canvas id="gl" aria-label="Midnight Pass stage"></canvas>

    <!-- HUD: hud.js writes these (R23). -->
    <div id="hud" role="status" aria-live="off">
      <div class="hud-cell"><span class="hud-label">Speed</span><span class="hud-value" id="hud-speed">0</span><span class="hud-unit">km/h</span></div>
      <div class="hud-cell"><span class="hud-label">Time</span><span class="hud-value" id="hud-time">0.00</span><span class="hud-unit">s</span></div>
      <div class="hud-cell"><span class="hud-label">Distance</span><span class="hud-value" id="hud-distance">0</span><span class="hud-unit">m</span></div>
      <div class="hud-cell"><span class="hud-label">Checkpoints</span><span class="hud-value" id="hud-checkpoints">0/4</span></div>
    </div>

    <!-- The top-left control band: the mode switch and the sound toggle, in ONE flex
         row so they can never overlap at any font size (the T025 layout gate measures
         every button and fails on any overlap). The band sits above the HUD strip and
         outside every overlay, so both controls are visible and tappable in every
         state. -->
    <div id="top-left" class="top-left">
      <!-- Mode switch (R17, R35): reachable from the ready screen and from both modes.
           It is only the UI — persist.js' getMode/setMode own the value, and main.js'
           setMode() applies it to the car and the setup screen. -->
      <div id="mode-switch" class="mode-switch" role="group" aria-label="Play mode">
        <button id="mode-virtual" class="mode-button" type="button" aria-pressed="true">Digital</button>
        <button id="mode-physical" class="mode-button" type="button" aria-pressed="false">Toy car</button>
      </div>

      <!-- Sound (R33): the mute toggle. A real button, labelled so the probe
           classifies it 'other' — neither steering nor a pedal. main.js paints
           aria-pressed and the label from the flag persist.js stores. -->
      <button id="btn-mute" class="mode-button mute-button" type="button" aria-pressed="false" aria-label="Sound">Sound on</button>
    </div>

    <!-- Touch controls: input.js drives these (R12–R15). Left = steering, right = pedals. -->
    <div id="controls">
      <div id="zone-steer" class="control-zone">
        <div id="steer-left" class="steer-pad">◀</div>
        <div id="steer-right" class="steer-pad">▶</div>
      </div>
      <div id="zone-pedal" class="control-zone">
        <div id="pedal-brake" class="pedal">Brake</div>
        <div id="pedal-throttle" class="pedal pedal-throttle">Throttle</div>
      </div>
    </div>

    <!-- Overlays: hud.js showOverlay(name) drives these (R29, R30). Each run state
         has its own panel; 'driving' shows none. Hidden panels are display:none, so
         they cannot swallow a touch meant for a pad. -->
    <div id="overlay-ready" class="overlay overlay-banner">
      <!-- R10: the stage preview. hud.js installStagePreview() paints the supplied
           opening artwork (assets/midnight-pass.webp) into this canvas from the bitmap
           the boot loader already decoded — the file is fetched once, at its original
           path (R11), and its relative URL is recorded in data-source. -->
      <div class="stage-preview-card">
        <canvas id="stage-preview" class="stage-preview" role="img"
          aria-label="Midnight Pass, the stage at dusk" data-source=""></canvas>
        <h1 class="overlay-title">Midnight Pass</h1>
      </div>
      <p class="overlay-note">Hold the right side to start the clock.</p>
    </div>
    <div id="overlay-pause" class="overlay overlay-card" hidden>
      <h2 class="overlay-title">Paused</h2>
      <p class="overlay-note" id="pause-time">—</p>
      <div class="overlay-actions">
        <button id="btn-resume" class="overlay-button" type="button">Resume</button>
        <button id="btn-restart" class="overlay-button" type="button">Restart</button>
      </div>
    </div>
    <div id="overlay-result" class="overlay overlay-card" hidden>
      <h2 class="overlay-title">Finish</h2>
      <p class="overlay-note" id="result-time">—</p>
      <p class="overlay-note" id="result-penalty">—</p>
      <p class="overlay-note" id="result-medal">—</p>
      <p class="overlay-note overlay-fine" id="result-collisions">—</p>
      <button id="btn-replay" class="overlay-button" type="button">Replay</button>
    </div>

    <!-- Physical-mode setup (R17, R18, R19): the play area the toy is placed in, the
         mark.svg marker on the saved anchor, and the two buttons. src/calibration.js
         drives it; hidden is the `hidden` attribute (display:none), so a closed setup
         cannot swallow a touch meant for a pad. -->
    <div id="calibration" class="overlay overlay-card setup-panel" hidden>
      <h2 class="overlay-title">Place the toy</h2>
      <p class="overlay-note">Tap where your car sits on the tablet, then save it.</p>
      <div id="calibration-area" class="play-area">
        <div id="calibration-marker" class="marker" role="button" tabindex="0"></div>
      </div>
      <div class="overlay-actions">
        <button id="btn-calibration-save" class="overlay-button" type="button">Save</button>
        <button id="btn-calibration-close" class="overlay-button" type="button">Done</button>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
