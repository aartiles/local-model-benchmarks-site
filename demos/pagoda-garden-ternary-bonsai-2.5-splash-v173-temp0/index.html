<body>
<div id="info">
  <h1>&#127953; Voxel Pagoda Garden</h1>
  Drag to orbit &middot; Scroll to zoom &middot; Right-drag to pan<br>
  Cherry petals are falling... enjoy the garden.

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================
//  VOXEL PAGODA GARDEN
//  A single-file Three.js voxel scene. Open in Chrome.
// ============================================================

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// Gradient sky (canvas texture stretched over the background)
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 1; skyCanvas.height = 256;
const skyCtx = skyCanvas.getContext('2d');
const skyGrad = skyCtx.createLinearGradient(0, 0, 0, 256);
skyGrad.addColorStop(0.0, '#3a7bd5');
skyGrad.addColorStop(0.55, '#8ec9ef');
skyGrad.addColorStop(0.85, '#f7e8c9');
skyGrad.addColorStop(1.0, '#ffe9c4');
skyCtx.fillStyle = skyGrad;
skyCtx.fillRect(0, 0, 1, 256);
scene.background = new THREE.CanvasTexture(skyCanvas);
scene.fog = new THREE.Fog(0x9fd0ef, 70, 160);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(34, 22, 38);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, -4);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.minDistance = 8;
controls.maxDistance = 120;

// ---------- Lights ----------
scene.add(new THREE.AmbientLight(0xbfd4e6, 0.55));
const sun = new THREE.DirectionalLight(0xfff2d0, 1.0);
sun.position.set(40, 50, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -45;
sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45;
sun.shadow.camera.bottom = -45;
sun.shadow.camera.far = 150;
sun.shadow.bias = -0.0005;
scene.add(sun);

// ---------- Helpers ----------
const mats = {};
function mat(color) {
  if (!mats[color]) mats[color] = new THREE.MeshLambertMaterial({ color: color });
  return mats[color];
}

function box(x, y, z, w, h, d, color, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  (parent || scene).add(m);
  return m;
}

// ---------- Ground (instanced tiles with color variation) ----------
const GROUND = 60;
const groundGeo = new THREE.BoxGeometry(1, 0.5, 1);
const groundMat = new THREE.MeshLambertMaterial();
const ground = new THREE.InstancedMesh(groundGeo, groundMat, GROUND * GROUND);
const m4 = new THREE.Matrix4();
const c3 = new THREE.Color();
let gi = 0;
for (let x = -GROUND / 2; x < GROUND / 2; x++) {
  for (let z = -GROUND / 2; z < GROUND / 2; z++) {
    m4.setPosition(x, -0.25, z);
    ground.setMatrixAt(gi, m4);
    const g = 0.30 + Math.random() * 0.14;
    c3.setRGB(0.18 + Math.random() * 0.10, g, 0.10 + Math.random() * 0.06);
    ground.setColorAt(gi, c3);
    gi++;
  }
}
ground.instanceMatrix.needsUpdate = true;
ground.instanceColor.needsUpdate = true;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Stone path (from gate to pagoda) ----------
for (let z = 30; z >= -12; z -= 1) {
  for (let x = -1; x <= 1; x++) {
    const shade = 0x9a9a9a + Math.floor(Math.random() * 30);
    box(x, 0.06, z, 0.95, 0.12, 0.95, shade, scene);
  }
}

// ---------- The Pagoda ----------
function makeRoof(parent, size, y, color) {
  // main roof slab
  box(0, y, 0, size, 0.5, size, color, parent);
  // ridge beam
  box(0, y + 0.35, 0, size * 0.6, 0.3, 0.4, color, parent);
  // upturned eave corners (the signature pagoda look)
  const c = size / 2 - 0.5;
  for (let px = -1; px <= 1; px += 2) {
    for (let pz = -1; pz <= 1; pz += 2) {
      box(px * c, y + 0.35, pz * c, 1.1, 0.6, 1.1, color, parent);
    }
  }
}

function buildPagoda(cx, cz) {
  const g = new THREE.Group();
  g.position.set(cx, 0, cz);

  // stone base platform
  box(0, 0.5, 0, 14, 1, 14, 0x8a8a8a, g);
  box(0, 1.2, 0, 12, 0.4, 12, 0x9e9e9e, g);

  const tiers = [
    { w: 10, h: 3, roof: 13 },
    { w: 8,  h: 3, roof: 11 },
    { w: 6,  h: 3, roof: 9 },
    { w: 4,  h: 3, roof: 7 },
  ];
  let y = 1.4;
  for (const t of tiers) {
    // balcony floor
    box(0, y + 0.2, 0, t.roof * 0.85, 0.4, t.roof * 0.85, 0x5a3a2a, g);
    // red walls
    box(0, y + 0.4 + t.h / 2, 0, t.w, t.h, t.w, 0xb22222, g);
    // dark pillars at corners
    const p = 0.5;
    for (let px = -1; px <= 1; px += 2) {
      for (let pz = -1; pz <= 1; pz += 2) {
        box(px * t.w / 2, y + 0.4 + t.h / 2, pz * t.w / 2, p, t.h, p, 0x3a2a1a, g);
      }
    }
    // door on the front face
    box(0, y + 0.4 + t.h * 0.35, t.w / 2, 1.6, t.h * 0.7, 0.3, 0x5a3a2a, g);
    // roof
    y = y + 0.4 + t.h;
    makeRoof(g, t.roof, y, t.roof > 10 ? 0x2a2a3a : 0x3a3a4a);
    y += 0.6;
  }
  // golden spire (sō)
  box(0, y + 1, 0, 0.5, 2, 0.5, 0xd4af37, g);
  box(0, y + 2.3, 0, 1, 1, 1, 0xd4af37, g);
  box(0, y + 3.1, 0, 0.5, 0.5, 0.5, 0xd4af37, g);

  scene.add(g);
}
buildPagoda(0, -10);

// ---------- Cherry Blossom Trees ----------
const PINKS = [0xffb6c1, 0xffd1dc, 0xffffff, 0xff9ec4, 0xffc0cb, 0xff8fab];
function cherryTree(x, z, scale) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  // trunk
  box(0, 1.5, 0, 1, 3, 1, 0x6b4226, g);
  box(0, 3.5, 0, 0.6, 1.5, 0.6, 0x6b4226, g);
  // branches
  box(-1.5, 3.5, 0, 1.6, 0.5, 0.5, 0x6b4226, g);
  box(1.5, 3.5, 0, 1.6, 0.5, 0.5, 0x6b4226, g);
  box(0, 3.5, 1.5, 0.5, 0.5, 1.6, 0x6b4226, g);
  box(0, 3.5, -1.5, 0.5, 0.5, 1.6, 0x6b4226, g);
  // fluffy blossom canopy
  for (let i = 0; i < 42; i++) {
    const r = Math.random() * 3;
    const a = Math.random() * Math.PI * 2;
    const s = 0.8 + Math.random() * 0.9;
    box(
      Math.cos(a) * r,
      4.2 + Math.random() * 1.8 - r * 0.3,
      Math.sin(a) * r,
      s, s * 0.8, s,
      PINKS[Math.floor(Math.random() * PINKS.length)],
      g
    );
  }
  g.scale.setScalar(scale);
  scene.add(g);
}
cherryTree(-12, -5, 1.1);
cherryTree(12, -8, 1.0);
cherryTree(-8, 8, 0.9);
cherryTree(10, 5, 0.85);
cherryTree(-16, 12, 0.8);

// ---------- Pine Trees ----------
function pineTree(x, z, scale) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  box(0, 1, 0, 0.8, 2, 0.8, 0x5a3a2a, g);
  const greens = [0x2e7d32, 0x388e3c, 0x1b5e20];
  let y = 2;
  for (let i = 0; i < 3; i++) {
    const s = 5 - i * 1.5;
    box(0, y + s / 2 - 0.5, 0, s, 1.5, s, greens[i % greens.length], g);
    y += 1.5;
  }
  box(0, y + 0.5, 0, 0.5, 1, 0.5, 0x5a3a2a, g);
  g.scale.setScalar(scale);
  scene.add(g);
}
pineTree(-18, -15, 1.1);
pineTree(18, -12, 1.0);
pineTree(-20, 5, 0.9);
pineTree(20, 15, 0.95);

// ---------- Koi Pond ----------
const pondX = 14, pondZ = 12;
(function buildPond() {
  box(pondX, 0.08, pondZ, 10, 0.16, 8, 0x4a90d9, scene);
  box(pondX, 0.04, pondZ, 10, 0.1, 8, 0x3a7bc0, scene);
  // stone rim
  for (let i = 0; i < 20; i++) {
    const a = i / 20 * Math.PI * 2;
    box(pondX + Math.cos(a) * 5, 0.15, pondZ + Math.sin(a) * 4, 1, 0.3, 1, 0x7a7a7a, scene);
  }
  // lily pads
  for (let i = 0; i < 4; i++) {
    const a = i * 1.7;
    box(pondX + Math.cos(a) * 2.5, 0.18, pondZ + Math.sin(a) * 1.8, 0.8, 0.06, 0.8, 0x2e8b57, scene);
  }
})();

// koi fish (animated)
const koi = [];
for (let i = 0; i < 3; i++) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.3), mat(0xff8c42));
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.3), mat(0xffffff));
  tail.position.x = -0.5;
  g.add(body, tail);
  body.castShadow = true;
  scene.add(g);
  koi.push({ g: g, angle: i * Math.PI * 2 / 3, speed: 0.5 + i * 0.15 });
}

// ---------- Stone Lanterns ----------
const lanterns = [];
function lantern(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  box(0, 0.3, 0, 1.5, 0.6, 1.5, 0x6a6a6a, g);
  box(0, 1.0, 0, 0.6, 1.4, 0.6, 0x7a7a7a, g);
  box(0, 1.9, 0, 1.2, 0.5, 1.2, 0x8a8a8a, g);
  box(0, 2.3, 0, 1.6, 0.4, 1.6, 0x8a8a8a, g);
  box(0, 2.6, 0, 1.0, 0.5, 1.0, 0x9a9a9a, g);
  // glowing window
  const glow = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 0.6),
    new THREE.MeshLambertMaterial({ color: 0xffcc66, emissive: 0xff9933 }));
  glow.position.set(0, 1.9, 0);
  g.add(glow);
  const light = new THREE.PointLight(0xffaa55, 0.9, 9);
  light.position.set(0, 2, 0);
  g.add(light);
  scene.add(g);
  lanterns.push(light);
}
lantern(3, 20);
lantern(-3, 15);
lantern(3, 5);
lantern(-3, 0);
lantern(11, 12);

// ---------- Torii Gate ----------
(function buildTorii() {
  const g = new THREE.Group();
  g.position.set(0, 0, 26);
  box(-2, 1.5, 0, 0.8, 3, 0.8, 0xc0392b, g);
  box(2, 1.5, 0, 0.8, 3, 0.8, 0xc0392b, g);
  box(0, 3.0, 0, 5.5, 0.6, 0.8, 0xc0392b, g);
  box(0, 2.5, 0, 4.5, 0.5, 0.6, 0xc0392b, g);
  box(0, 3.4, 0, 5.5, 0.4, 0.8, 0xc0392b, g);
  scene.add(g);
})();

// ---------- Bamboo Grove ----------
function bamboo(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const h = 6 + Math.random() * 2;
  box(0, h / 2, 0, 0.4, h, 0.4, 0x4caf50, g);
  for (let y = 0.5; y < h; y += 1) {
    box(0, y, 0, 0.5, 0.15, 0.5, 0x388e3c, g);
  }
  for (let i = 0; i < 5; i++) {
    box(0.3, h - 0.5 + i * 0.3, 0, 0.8, 0.15, 0.3, 0x66bb6a, g);
  }
  scene.add(g);
}
for (let i = 0; i < 10; i++) {
  bamboo(-20 + Math.random() * 4, -12 + Math.random() * 6);
}

// ---------- Rocks ----------
for (let i = 0; i < 14; i++) {
  const s = 0.6 + Math.random() * 1.4;
  const x = (Math.random() - 0.5) * 40;
  const z = (Math.random() - 0.5) * 40;
  if (Math.abs(x) < 4 && z > -14 && z < 32) continue; // keep path clear
  box(x, s / 2, z, s, s * 0.7, s, 0x808080, scene);
}

// ---------- Flowers ----------
const FLOWER_COLORS = [0xff69b4, 0xffd700, 0x9370db, 0xff4500, 0x00ced1, 0xff1493];
for (let i = 0; i < 40; i++) {
  const x = (Math.random() - 0.5) * 44;
  const z = (Math.random() - 0.5) * 44;
  if (Math.abs(x) < 3 && z > -14 && z < 32) continue;
  if (Math.abs(x - pondX) < 6 && Math.abs(z - pondZ) < 5) continue;
  box(x, 0.3, z, 0.15, 0.6, 0.15, 0x388e3c, scene);
  box(x, 0.65, z, 0.4, 0.3, 0.4, FLOWER_COLORS[i % FLOWER_COLORS.length], scene);
}

// ---------- Garden Fence ----------
(function buildFence() {
  const L = 56;
  for (let i = 0; i <= L; i += 2) {
    const t = i / L * (L / 2);
    box(-L / 2, 0.7, t, 0.3, 1.4, 0.3, 0x8b5a2b, scene);
    box(L / 2, 0.7, t, 0.3, 1.4, 0.3, 0x8b5a2b, scene);
    box(-L / 2, 1.1, t, 0.3, 0.2, 0.3, 0x6b4226, scene);
    box(L / 2, 1.1, t, 0.3, 0.2, 0.3, 0x6b4226, scene);
    box(t, 0.7, -L / 2, 0.3, 1.4, 0.3, 0x8b5a2b, scene);
    box(t, 0.7, L / 2, 0.3, 1.4, 0.3, 0x8b5a2b, scene);
  }
  // rails
  for (let i = 0; i < L; i += 2) {
    const t = i / L * (L / 2);
    box(-L / 2, 1.0, t, 0.2, 0.2, 2, 0x6b4226, scene);
    box(L / 2, 1.0, t, 0.2, 0.2, 2, 0x6b4226, scene);
    box(t, 1.0, -L / 2, 2, 0.2, 0.2, 0x6b4226, scene);
    box(t, 1.0, L / 2, 2, 0.2, 0.2, 0x6b4226, scene);
  }
})();

// ---------- Clouds ----------
const clouds = [];
function cloud(x, y, z) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  for (let i = 0; i < 6; i++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(3, 1.5, 2), mat(0xffffff));
    m.position.set((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 3);
    g.add(m);
  }
  scene.add(g);
  clouds.push(g);
}
cloud(-30, 32, -20);
cloud(25, 36, -35);
cloud(5, 34, 30);
cloud(-15, 38, 15);
cloud(35, 30, 10);

// ---------- Sun ----------
box(45, 45, -45, 4, 4, 4, 0xffe066, scene);

// ---------- Falling Cherry Petals ----------
const petalGeo = new THREE.BoxGeometry(0.3, 0.05, 0.15);
const petalMat = new THREE.MeshLambertMaterial({ color: 0xffb6c1 });
const petals = [];
for (let i = 0; i < 60; i++) {
  const m = new THREE.Mesh(petalGeo, petalMat);
  m.position.set((Math.random() - 0.5) * 40, Math.random() * 20, (Math.random() - 0.5) * 40);
  scene.add(m);
  petals.push({
    m: m,
    vy: -0.5 - Math.random() * 0.5,
    phase: Math.random() * Math.PI * 2
  });
}

// ---------- Animation Loop ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // koi swimming in an ellipse
  koi.forEach(k => {
    k.angle += k.speed * dt;
    k.g.position.set(pondX + Math.cos(k.angle) * 3.5, 0.15, pondZ + Math.sin(k.angle) * 2.5);
    k.g.rotation.y = -k.angle + Math.PI / 2;
  });

  // clouds drift
  clouds.forEach(c => {
    c.position.x += dt * 0.3;
    if (c.position.x > 60) c.position.x = -60;
  });

  // petals fall and sway
  petals.forEach(p => {
    p.m.position.y += p.vy * dt;
    p.m.position.x += Math.sin(p.phase + t) * 0.4 * dt;
    p.m.rotation.y += dt * 1.5;
    p.m.rotation.x += dt * 0.5;
    if (p.m.position.y < 0) {
      p.m.position.y = 15 + Math.random() * 10;
      p.m.position.x = (Math.random() - 0.5) * 40;
      p.m.position.z = (Math.random() - 0.5) * 40;
    }
  });

  // lantern glow pulses gently
  lanterns.forEach((l, i) => {
    l.intensity = 0.8 + Math.sin(t * 2 + i) * 0.15;
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
